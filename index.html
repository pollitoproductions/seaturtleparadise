        const fleshGrad = ctx.createRadialGradient(-f.size*0.1, -f.size*0.1, 0, 0, 0, f.size * 0.9);
        fleshGrad.addColorStop(0, '#ffffff'); // Bright white center highlight
        fleshGrad.addColorStop(0.4, '#e0f7e6'); // Pale green mid-tone
        fleshGrad.addColorStop(0.8, '#a3e0b8'); // Solid cucumber flesh color
        fleshGrad.addColorStop(1, '#5db37a'); // Darker inner shadow near the rind
        ctx.fillStyle = fleshGrad;
        ctx.beginPath();
        ctx.arc(0, 0, f.size * 0.88, 0, Math.PI * 2);
        ctx.fill();

        // Shaded seed cavities
        for (let i = 0; i < 3; i++) {
          const angle = (Math.PI * 2 / 3) * i;
          ctx.save();
          ctx.rotate(angle);
          
          // Cavity background with inner shadow
          const cavityGrad = ctx.createRadialGradient(f.size * 0.35, 0, 0, f.size * 0.35, 0, f.size * 0.25);
          cavityGrad.addColorStop(0, 'rgba(150, 210, 170, 0.4)'); // Translucent center
          cavityGrad.addColorStop(1, 'rgba(100, 180, 130, 0.8)'); // Darker edge for depth

          ctx.fillStyle = cavityGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(f.size * 0.3, f.size * 0.25, f.size * 0.6, f.size * 0.35, f.size * 0.5, 0);
          ctx.bezierCurveTo(f.size * 0.6, -f.size * 0.35, f.size * 0.3, -f.size * 0.25, 0, 0);
          ctx.fill();

          // Seeds with slight drop shadows
          ctx.shadowColor = 'rgba(0,0,0,0.2)';
          ctx.shadowBlur = 2;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = '#fffff0'; // Slightly off-white seeds
          ctx.beginPath();
          ctx.ellipse(f.size * 0.35, f.size * 0.12, f.size * 0.08, f.size * 0.04, 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(f.size * 0.35, -f.size * 0.12, f.size * 0.08, f.size * 0.04, -0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      });

      // 4. Waves
      gameState.waves = gameState.waves.filter(w => w.age < w.life);
      gameState.waves.forEach(w => {
        w.age += dt;
        const prog = w.age / w.life;
        const radius = 10 + (w.age * w.speed);
        const alpha = 1 - prog;
        
        ctx.beginPath();
        ctx.arc(w.x, w.y, radius, 0, Math.PI * 2);
        ctx.lineWidth = 4 * alpha;
        ctx.strokeStyle = `rgba(180, 230, 255, ${alpha * 0.5})`;
        ctx.stroke();
      });

      // 5. Turtles
      turtles.forEach(t => {
        // at night, the night sleepers swim away to sleep — they're not
        // here, so skip them (they come back in the daytime, and the
        // jellyfish get the lagoon to themselves)
        if (theme === 'night' && t.nightSleeper) return;

        let isAvoidingEdge = false;
        let foundFood = false;
        let scaredByWave = false;


        // Check for nearby waves and scare turtles away (ignore waves created by food drops)
        let nearestWaveDist = Infinity;
        let nearestWave = null;
        gameState.waves.forEach(w => {
          if (w.source === 'food' || w.source === 'waterfall' || w.source === 'splash') return; // food, waterfall and splashes don't scare turtles
          const dist = Math.hypot(w.x - t.x, w.y - t.y);
          if (dist < nearestWaveDist) {
            nearestWaveDist = dist;
            nearestWave = w;
          }
        });
        if (nearestWave && nearestWaveDist < 120) {
          scaredByWave = true;
          t.targetAngle = Math.atan2(t.y - nearestWave.y, t.x - nearestWave.x);
          t.speed = t.baseSpeed * 3.5;
        }

        if (!scaredByWave && gameState.food.length > 0) {
          let nearestFood = null;
          let nearestDist = Infinity;
          gameState.food.forEach((f, index) => {
            if (f.kind && f.kind !== 'cucumber') return; // turtles only eat cucumber
            const dist = Math.hypot(f.x - t.x, f.y - t.y);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearestFood = { f, index };
            }
          });
          if (nearestFood && nearestDist < 1200) {
            foundFood = true;
            t.targetAngle = Math.atan2(nearestFood.f.y - t.y, nearestFood.f.x - t.x);
            t.speed = t.baseSpeed * 4.5;
            if (nearestDist < 60 * t.scaleMult) {
               gameState.food.splice(nearestFood.index, 1);
               // happy turtle! It spins with joy and hearts float up
               // for a few seconds after eating. Feeding fills its
               // Tamagotchi hearts a little bit too. If it was hungry,
               // eating clears its food need.
               t.happy = 180;
               t.happySpin = 0;
               careFor(t, 15);
               if (t.need === 'food') clearNeed(t);
            }
          }
        }

        if (!foundFood) t.speed = t.baseSpeed;

        // Play with balls: a turtle that spots a beach ball nearby
        // swims over and nudges it — and feels happy doing it.
        if (!foundFood && !scaredByWave && gameState.balls.length > 0) {
          let nearestBall = null, nearestBallDist = Infinity;
          gameState.balls.forEach(b => {
            const d = Math.hypot(b.x - t.x, b.y - t.y);
            if (d < nearestBallDist) { nearestBallDist = d; nearestBall = b; }
          });
          if (nearestBall && nearestBallDist < 400) {
            t.targetAngle = Math.atan2(nearestBall.y - t.y, nearestBall.x - t.x);
            t.speed = t.baseSpeed * 2.5;
            if (nearestBallDist < 55 * t.scaleMult) {
              const a = Math.atan2(nearestBall.y - t.y, nearestBall.x - t.x);
              nearestBall.vx += Math.cos(a) * 2;
              nearestBall.vy += Math.sin(a) * 2;
              if (t.happy <= 0) t.happy = 60;
            }
          }
        }

        if (!foundFood && Math.random() < 0.01 * dt) {
          t.targetAngle += (Math.random() - 0.5) * Math.PI;
        }
        

        // Reduce margin so turtles can wander farther off screen
        const marginX = Math.min(width * 0.05, 44 * t.scaleMult);
        const marginY = Math.min(height * 0.05, 44 * t.scaleMult);

        // Only avoid edges when not actively pursuing food; allow small off-screen roaming while chasing
        if (!foundFood && (t.x < marginX || t.x > width - marginX || t.y < marginY || t.y > height - marginY)) {
          isAvoidingEdge = true;
          t.targetAngle = Math.atan2((height / 2) - t.y, (width / 2) - t.x);
        }

        let diff = t.targetAngle - t.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        t.angle += diff * (isAvoidingEdge ? 0.08 : (foundFood ? 0.07 : 0.015)) * dt;
        t.x += Math.cos(t.angle) * t.speed * dt;
        t.y += Math.sin(t.angle) * t.speed * dt;


        // Every turtle stays inside the frame — no drifting off-screen.
        // (The old code let them wander ~12% past the edge to reach
        // food; now they stay fully visible, and can still reach food
        // at the edge from 36px in.)
        const padding = 36;
        t.x = Math.max(padding, Math.min(width - padding, t.x));
        t.y = Math.max(padding, Math.min(height - padding, t.y));

        // Rocks are solid: a turtle that swims into the waterfall gets
        // pushed back out (to the nearest edge — left or bottom) and
        // steered back toward the lagoon. The 22px margin keeps its
        // body clear of the stones instead of overlapping them. The
        // rocks and the cliff face are the wall — below the water's
        // base the lagoon is open, so turtles can swim in the pool at
        // the foot of the fall, just not up under the rocks.
        var out = pushOutOfWaterfallRocks(t.x, t.y, width, height, 22);
        if (out.inRocks){
          t.x = out.x; t.y = out.y;
          t.targetAngle = Math.atan2((height / 2) - t.y, (width / 2) - t.x);
        }

        // Happy spin: after eating, the turtle spins with joy for a
        // few seconds (t.happy counts down from 180 frames).
        if (t.happy > 0) { t.happy -= dt; t.happySpin = (t.happySpin || 0) + dt * 0.04; }
        // the hearts meter fades away a few seconds after you care for it
        if (t.heartShow > 0) t.heartShow -= dt;
        // Needs: when the timer runs out, the turtle wants something —
        // love, food, or a pat. The icon stays until you help.
        if (!t.need) {
          t.needTimer -= dt;
          if (t.needTimer <= 0) {
            const kinds = ['love', 'food', 'pat'];
            t.need = kinds[Math.floor(Math.random() * kinds.length)];
          }
        }

        drawRealisticTurtle(ctx, time, width, height, t);

        // the need icon floats above the turtle in a little bubble
        if (t.need) {
          const bob = Math.sin(time * 0.003 + (t.phase || 0)) * 4;
          const ny = t.y - 72 + bob;
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
          ctx.beginPath();
          ctx.arc(t.x, ny, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(NEED_ICON[t.need], t.x, ny + 1);
          ctx.restore();
        }
      });

    // --- Mini waterfall (top-right corner) ---
    // A watercolor waterfall in the corner, like the painting Brant
    // shared: soft rounded boulders in two tiers, green plants at
    // the top, and the water pouring down in two steps into a pool.
    // The whole fall is turned DIAGONALLY so its face points straight
    // at the center of the screen, cutting off the corner — the face
    // runs from the top edge down to just left of the button column,
    // and the water pours down it toward the middle of the lagoon.
    // The rocks are solid — nothing goes under them — but the pool
    // at the foot of the fall is open water, so animals can swim in
    // it, just not up under the rocks.
    // (Performance: this replaces the old faceted stones, photo
    // patterns and per-stone clip/crack work with simple soft shapes,
    // and the waterfall makes NO automatic waves. The old auto-ripple
    // pushed a wave every 1.4s and those waves piling up at the fall
    // were what froze the game — the water still animates, via the
    // streaks, foam and mist, but it no longer spawns waves.)
    // One scale for the whole waterfall, from BOTH dimensions so it
    // fits in portrait and landscape: it shrinks on narrow screens
    // AND on short screens, so it never takes up half the frame.
    function waterfallScale(width, height){
      return Math.max(0.35, Math.min(0.75, Math.min(width / 1000, height / 800)));
    }
    // Geometry of the diagonal fall. The face is the diagonal from
    // the top edge to just left of the button column; its midpoint is
    // the origin of a local frame where u runs along the face and v
    // runs down the fall (toward the center). The rocks are the band
    // v in [-Hback, 0] (behind the face, toward the corner); the pool
    // is the open water in front of the face (v > 0). H1 is the
    // middle ledge between the two tiers of rocks.
    function waterfallGeom(width, height){
      const sc = waterfallScale(width, height);
      const BTN = 90; // keep the face left of the button column
      const L = Math.min(width, height) * 0.45; // face extent along top & right
      const cx = width - BTN - L / 2, cy = L / 2; // face midpoint
      const W = L * Math.SQRT2; // face length (the diagonal)
      const Hback = 120 * sc; // rock band depth (two tiers)
      const H1 = 60 * sc; // middle ledge (between the tiers)
      const Hpool = 70 * sc; // pool depth past the face
      return { sc, BTN, L, cx, cy, W, Hback, H1, Hpool };
    }
    // Screen point -> local (u,v) in the waterfall frame.
    function waterfallLocal(x, y, g){
      const dx = x - g.cx, dy = y - g.cy, k = Math.SQRT1_2;
      return { u: (dx + dy) * k, v: (dy - dx) * k };
    }
    // Push a point out of the rocks, down the fall into the open pool.
    // Returns {x, y, inRocks}. The push is along v (toward the center),
    // so the animal slides out into the pool at the foot of the fall.
    function pushOutOfWaterfallRocks(x, y, width, height, margin){
      const g = waterfallGeom(width, height);
      const p = waterfallLocal(x, y, g);
      if (p.u > -g.W / 2 && p.u < g.W / 2 && p.v > -g.Hback && p.v < 0){
        const k = Math.SQRT1_2, v2 = margin;
        return { x: g.cx + k * p.u - k * v2, y: g.cy + k * p.u + k * v2, inRocks: true };
      }
      return { x, y, inRocks: false };
    }
    function drawWaterfall(ctx, time, width, height){
      const g = waterfallGeom(width, height);
      const { sc, cx, cy, W, Hback, H1, Hpool } = g;
      // watercolor boulder palette (soft, from the painting)
      const BOULDER_COLORS = ['#b9bec2', '#c8c1b1', '#a9aeb3', '#d2ccbc', '#9ea4a9'];
      // the two tiers of rounded boulders, as [uFrac, vFrac, rxFrac, ryFrac, colorIdx]
      // u is along the face (fraction of W), v is down the fall
      // (fraction of Hback, negative = behind the face toward the corner)
      const BOULDERS = [
        // upper tier
        [-0.30, -0.92, 0.17, 0.22, 0],
        [0, -0.95, 0.19, 0.23, 1],
        [0.30, -0.92, 0.17, 0.22, 2],
        [-0.37, -0.68, 0.14, 0.18, 3],
        [0.37, -0.68, 0.14, 0.18, 0],
        [-0.23, -0.62, 0.10, 0.14, 4],
        [0.23, -0.62, 0.10, 0.14, 2],
        // lower tier
        [-0.35, -0.32, 0.15, 0.18, 1],
        [0.35, -0.32, 0.15, 0.18, 3],
        [-0.22, -0.16, 0.10, 0.14, 0],
        [0.22, -0.16, 0.10, 0.14, 4],
        [-0.28, -0.06, 0.13, 0.14, 2],
        [0, -0.05, 0.15, 0.13, 1],
        [0.28, -0.06, 0.13, 0.14, 0],
      ];
      // a single soft watercolor boulder: a rounded wash, a lighter
      // wash on the upper-left, a soft shadow lower-right, a faint
      // rim — no hard outline, no facets, no cracks.
      function boulder(u, v, rx, ry, base){
        ctx.fillStyle = base;
        ctx.beginPath(); ctx.ellipse(u, v, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.ellipse(u - rx * 0.25, v - ry * 0.3, rx * 0.6, ry * 0.55, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(60,70,80,0.28)';
        ctx.beginPath(); ctx.ellipse(u + rx * 0.3, v + ry * 0.35, rx * 0.55, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(90,100,110,0.22)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(u, v, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      }
      // a soft watercolor plant: leaves fanning up and out, muted greens.
      function plant(u, v, s){
        const greens = ['#7a9a6a', '#8aa87a', '#6a8a5a', '#9ab88a', '#7fa06e'];
        for (let i = 0; i < 5; i++){
          const a = -Math.PI / 2 + (i - 2) * 0.38;
          const len = s * (0.9 + (i % 2) * 0.3);
          ctx.fillStyle = greens[i % greens.length];
          ctx.globalAlpha = 0.7;
          ctx.beginPath();
          ctx.ellipse(u + Math.cos(a) * len * 0.5, v + Math.sin(a) * len * 0.5, s * 0.16, len * 0.5, a + Math.PI / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);
      // 1. the two tiers of boulders
      for (const [uf, vf, rxf, ryf, ci] of BOULDERS){
        boulder(uf * W, vf * Hback, rxf * W, ryf * Hback, BOULDER_COLORS[ci]);
      }
      // 2. greenery at the top corners (and one tuft on the left)
      plant(-W * 0.44, -Hback * 0.98, 26 * sc);
      plant(W * 0.44, -Hback * 0.98, 26 * sc);
      plant(-W * 0.47, -Hback * 0.45, 18 * sc);
      // 3. the water, in 'water' mode only — two steps, like the painting
      if (mode === 'water'){
        const wc = W * 0.19; // half-width of the water channel
        // upper fall: soft wash from the top to the middle ledge
        ctx.fillStyle = 'rgba(224, 240, 255, 0.78)';
        ctx.fillRect(-wc, -Hback, wc * 2, Hback - H1);
        // lower fall: middle ledge to the face
        ctx.fillStyle = 'rgba(224, 240, 255, 0.78)';
        ctx.fillRect(-wc, -H1, wc * 2, H1);
        // animated streaks, flowing down both falls
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++){
          const sx = -wc + (i + 0.5) * (wc * 2 / 6);
          // upper fall streak
          const off1 = (time * 0.045 + i * 31) % (Hback - H1);
          const y1 = -Hback + off1;
          ctx.beginPath(); ctx.moveTo(sx, y1); ctx.lineTo(sx, Math.min(y1 + 26 * sc, -H1)); ctx.stroke();
          // lower fall streak
          const off2 = (time * 0.045 + i * 47) % H1;
          const y2 = -H1 + off2;
          ctx.beginPath(); ctx.moveTo(sx, y2); ctx.lineTo(sx, Math.min(y2 + 26 * sc, 0)); ctx.stroke();
        }
        // middle ledge: a small pool where the upper fall lands
        ctx.fillStyle = 'rgba(214, 236, 252, 0.85)';
        ctx.beginPath(); ctx.ellipse(0, -H1, wc * 1.25, 9 * sc, 0, 0, Math.PI * 2); ctx.fill();
        // bottom pool: where the lower fall lands, spreading into the lagoon
        ctx.fillStyle = 'rgba(214, 236, 252, 0.8)';
        ctx.beginPath(); ctx.ellipse(0, Hpool * 0.35, wc * 1.6, 12 * sc, 0, 0, Math.PI * 2); ctx.fill();
        // foam bubbles at the foot
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 8; i++){
          const fx = (i - 3.5) * (wc * 0.32);
          const fy = Hpool * 0.3 + Math.sin(time * 0.003 + i * 1.7) * 3 * sc;
          const fr = (3 + (i % 3)) * sc;
          ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
        }
        // soft mist puffs drifting up from the pool (plain circles, no gradients)
        for (let i = 0; i < 3; i++){
          const mx2 = (i - 1) * wc * 0.7;
          const my2 = Hpool * 0.5 - ((time * 0.02 + i * 23) % 26) * sc;
          ctx.fillStyle = 'rgba(235, 245, 255, 0.14)';
          ctx.beginPath(); ctx.arc(mx2, my2, (14 + i * 4) * sc, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }

      // 5.5 Rare visitors (stingray / baby stingray / baby whale shark)
      updateVisitors(time, dt, width, height);
      visitors.forEach(v => {
        if (v.kind === 'whaleShark') drawWhaleShark(ctx, time, v);
        else drawStingray(ctx, time, v);
      });
      // 5.5b Unlocked pets (seahorse / baby otter / baby octopus)
      updatePets(time, dt, width, height);
      pets.forEach(p => {
        if (p.kind === 'seahorse') drawSeahorse(ctx, time, p);
        else if (p.kind === 'otter') drawOtter(ctx, time, p);
        else drawOctopus(ctx, time, p);
      });
      // 5.6 Glowing jellyfish (night only, all different colours)
      updateJellyfish(time, dt, width, height);
      jellyfish.forEach(j => drawJellyfish(ctx, time, j));
      // 5.7 Treasures to collect (shells + starfish on the seafloor)
      updateCollectibles(time, dt, width, height);
      collectibles.forEach(c => drawCollectible(ctx, time, c));
      // 5.8 Beach balls: they bob and drift slowly; turtles swim over
      // and nudge them when they play
      gameState.balls.forEach(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt + Math.sin(time * 0.002 + b.phase) * 0.3 * dt;
        b.vx *= 0.985; b.vy *= 0.985;
        if (b.x < 30) { b.x = 30; b.vx = Math.abs(b.vx); }
        if (b.x > width - 30) { b.x = width - 30; b.vx = -Math.abs(b.vx); }
        if (b.y < 30) { b.y = 30; b.vy = Math.abs(b.vy); }
        if (b.y > height - 30) { b.y = height - 30; b.vy = -Math.abs(b.vy); }
        const bob = Math.sin(time * 0.002 + b.phase) * 2;
        ctx.save();
        ctx.translate(b.x, b.y + bob);
        ctx.rotate(b.rot + time * 0.0004);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, -0.6, 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 217, 61, 0.9)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, 2.0, 3.2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
      // tiny splashes (baby whale shark entering / leaving)
      for (let i = splashes.length - 1; i >= 0; i--) {
        const sp = splashes[i];
        sp.age += dt;
        if (sp.age >= sp.life) { splashes.splice(i, 1); continue; }
        const prog = sp.age / sp.life;
        for (let j = 0; j < 6; j++) {
          const a = -Math.PI / 2 + (j - 2.5) * 0.35;
          const d = prog * 26;
          ctx.beginPath();
          ctx.arc(sp.x + Math.cos(a) * d, sp.y + Math.sin(a) * d - prog * prog * 10, Math.max(0.5, 2.5 * (1 - prog)), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(230, 245, 255, ${0.8 * (1 - prog)})`;
          ctx.fill();
        }
      }

      // 6. Particles
      particles.forEach((p, idx) => {
        if (lowQuality && idx % 2) return; // half the particles when slow
        p.y -= p.speed * dt;
        p.x += Math.sin(time * 0.001 + p.offset) * 0.4 * dt;
        if (p.y < -20) { p.y = height + 20; p.x = Math.random() * width; }
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 7. Waterfall (top-right corner, in front of the turtles)
      drawWaterfall(ctx, time, width, height);

      requestAnimationFrame(render);
    }
    
    // Load your saved shells, starfish, and animals before the game starts.
    loadGame();
    updateTreasureCount();
    updateMenuUnlock();

    requestAnimationFrame(render);

    // --- Interactive Input Handlers ---
    const handlePointerDown = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Tap a glowing jellyfish and it flares bright (no food / wave).
      for (let i = jellyfish.length - 1; i >= 0; i--) {
        const j = jellyfish[i];
        if (Math.hypot(x - j.x, y - j.y) < j.size + 24) { j.lit = 1; return; }
      }

      // Tap a shell or starfish to collect it (no food / wave). A new
      // one washes up so there's always something to find. Collecting
      // 1,000 of either kind earns a new animal!
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        if (Math.hypot(x - c.x, y - c.y) < c.size + 16) {
          if (c.kind === 'shell') shellCount++; else starCount++;
          updateTreasureCount();
          collectibles.splice(i, 1);
          checkUnlock();
          saveGame();
          return;
        }
      }

      // Pet an unlocked animal: tap one and it wiggles happily.
      for (let i = 0; i < pets.length; i++) {
        const p = pets[i];
        if (Math.hypot(x - p.x, y - p.y) < 55 * p.scale + 14) {
          p.happy = 120;
          return;
        }
      }

      // Pet a turtle: tap one and it wiggles happily, hearts float up,
      // and its Tamagotchi hearts fill a little (no food / wave). If it
      // wanted love or a pat on the head, petting clears that need.
      for (let i = 0; i < turtles.length; i++) {
        const t = turtles[i];
        if (theme === 'night' && t.nightSleeper) continue;
        const tapR = 60 * Math.min(1, Math.min(canvas.width, canvas.height) / 900) * t.scaleMult + 18;
        if (Math.hypot(x - t.x, y - t.y) < tapR) {
          t.happy = 120;
          t.happySpin = 0;
          careFor(t, 10);
          if (t.need === 'love' || t.need === 'pat') clearNeed(t);
          return;
        }
      }

      gameState.pointerActive = true;
      gameState.lastX = x;
      gameState.lastY = y;

      // Clamp food drop position to turtles' reachable area
      const foodPadding = Math.min(canvas.width * 0.2, canvas.height * 0.2, 180);
      const clampedX = Math.max(foodPadding * -1, Math.min(canvas.width + foodPadding, x));
      const clampedY = Math.max(foodPadding * -1, Math.min(canvas.height + foodPadding, y));
      if (mode === 'food') {
        pushFood({ x: clampedX, y: clampedY, size: 0, targetSize: foodKind === 'seaweed' ? 9 : 7, rot: Math.random() * Math.PI * 2, kind: foodKind });
        // mark waves created by food drops so turtles won't be scared by them
        pushWave({ x: clampedX, y: clampedY, age: 0, life: 60, speed: 1.5, source: 'food' });
      } else if (mode === 'ball') {
        // drop a beach ball into the water for the turtles to play with
        const colors = ['#ff5a5a', '#4fc3f7', '#ffd93d', '#81c784', '#b388ff'];
        gameState.balls.push({
          x: clampedX, y: clampedY, vx: 0, vy: 0,
          r: 16 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          phase: Math.random() * 1000
        });
        if (gameState.balls.length > 8) gameState.balls.shift();
      } else {
        pushWave({ x, y, age: 0, life: 70, speed: 2.0, source: 'water' });
      }
    };

    const handlePointerMove = (e) => {
      if (!gameState.pointerActive || mode !== 'water') return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const dx = x - gameState.lastX;
      const dy = y - gameState.lastY;
      if (Math.hypot(dx, dy) > 25) {
        pushWave({ x, y, age: 0, life: 60, speed: 1.8 });
        gameState.lastX = x;
        gameState.lastY = y;
      }
    };

    const handlePointerUp = () => { gameState.pointerActive = false; };

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointerleave', handlePointerUp);

  </script>
</body>
</html>

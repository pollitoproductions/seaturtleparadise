<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sea Turtle Paradise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #021a19; touch-action: none; }
    /* Track the VISIBLE window on a phone, not the full height including
       the browser toolbar (100vh counts the toolbar; 100dvh follows it
       as it shows and hides). The body.relative selector beats Tailwind's
       h-screen class so this actually takes effect. */
    body.relative { height: 100dvh; }
    /* The canvas fills the body exactly (100%, not 100vw/100vh — vw can
       run wider than the visible window on a phone, which made the page
       overflow, the browser zoom out, and the buttons' tap targets land
       somewhere other than where the buttons are drawn). Its internal
       resolution is set from clientWidth/clientHeight in resizeCanvas so
       it always matches the size on screen. */
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    /* Buttons must answer a tap promptly: manipulation disables the
       double-tap-to-zoom gesture on them, so rapid kid taps register as
       taps instead of fighting the browser's zoom handling. */
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="relative w-full h-screen overflow-hidden bg-[#021a19]">

  <div class="absolute top-[max(2rem,env(safe-area-inset-top))] right-[max(2rem,env(safe-area-inset-right))] flex flex-col gap-4 z-20 pointer-events-auto">

      class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-cyan-500/30 border border-cyan-200 text-white shadow-[0_0_15px_rgba(34,211,238,0.5)] scale-110"
      title="Water Interaction Mode"
    >
      <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M2 12C4 12 5 14 8 14C11 14 13 10 16 10C19 10 20 12 22 12M2 16C4 16 5 18 8 18C11 18 13 14 16 14C19 14 20 16 22 16" />
      </svg>
    </button>
    <button

      class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-green-300 hover:bg-slate-800/60 shadow-lg"

        <ellipse cx="10" cy="14" rx="0.8" ry="0.4" fill="#fff" transform="rotate(210 10 14)"/>
        <ellipse cx="11" cy="15" rx="0.8" ry="0.4" fill="#fff" transform="rotate(270 11 15)"/>

    <button

        <path d="M11 5L6 9H3v6h3l5 4V5z" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        <path d="M19.07 5.93a9 9 0 0 1 0 12.73" />

    </button>
    <button
      id="dayNightBtn"
      class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-white hover:bg-slate-800/60 shadow-lg"
      title="Toggle Day/Night"

    >
      <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

        <path d="M12 2 A 5 5 0 0 1 12 12 A 5 5 0 0 0 12 22" />
        <circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none" />

    <button

      aria-label="Fullscreen"

        <path d="M21 8V5a2 2 0 0 0-2-2h-3" />

  <!-- Collection menu button (top-left) — tap to see what you've collected -->
  <button id="menuBtn" class="absolute top-[max(2rem,env(safe-area-inset-top))] left-[max(2rem,env(safe-area-inset-left))] z-20 w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md bg-slate-900/50 border border-slate-600 text-white text-2xl shadow-lg" title="My Collection" aria-label="My Collection">🐢</button>
  <!-- Collection menu panel (hidden until you tap the button) -->
  <div id="menuPanel" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30 hidden w-72 max-w-[85vw] rounded-2xl backdrop-blur-md bg-slate-900/80 border border-slate-600 text-white p-5 shadow-2xl">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-xl font-bold">My Collection</h2>
      <button id="menuClose" class="w-8 h-8 rounded-full bg-slate-700/70 text-white text-lg leading-none">✕</button>
    </div>
    <div class="text-lg mb-1">🐚 Shells: <span id="menuShells">0</span></div>
    <div class="text-lg mb-3">⭐ Starfish: <span id="menuStars">0</span></div>
    <div class="border-t border-slate-600 pt-3">
      <div class="text-sm text-slate-300 mb-1">Animals</div>
      <div class="text-sm">🐢 Turtles — take care of them and they'll grow!</div>
      <div id="petList" class="text-sm"></div>
      <div id="petHint" class="text-sm text-slate-400">New animals will appear here when you unlock them.</div>
    </div>
    <div id="unlockSection" class="hidden border-t border-amber-400/60 pt-3 mt-3">
      <div class="text-base font-bold text-amber-300 mb-1">🎉 You unlocked a new animal!</div>
      <div class="text-sm text-slate-300 mb-2">There's a mystery shell waiting. Tap it twice to open it!</div>
      <button id="mysteryShell" class="w-20 h-20 rounded-full bg-slate-700/70 text-5xl flex items-center justify-center mx-auto my-2">🐚</button>
      <div id="unlockReveal" class="hidden text-center text-base font-bold text-emerald-300"></div>
    </div>
  </div>

  <div id="unlockToast" class="absolute top-24 left-1/2 -translate-x-1/2 z-30 hidden rounded-full backdrop-blur-md bg-amber-400/95 text-slate-900 font-bold px-5 py-3 shadow-2xl text-base cursor-pointer whitespace-nowrap">🎉 You unlocked a new animal! Tap here to open your menu! 🐚</div>

    // Always match canvas internal resolution to visible size to prevent stretching.
    // Size the canvas from its ACTUAL on-screen size (clientWidth /
    // clientHeight), not window.innerWidth/innerHeight — on a phone the
    // window size can include the browser toolbar area, which made the
    // canvas wider/taller than the visible window and threw the buttons'
    // tap targets off. The CSS already makes it fill the body, so this
    // only sets the internal resolution to match.
    function resizeCanvas() {
      const w = canvas.clientWidth || window.innerWidth;
      const h = canvas.clientHeight || window.innerHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;

    // Create a looping buffer that blends smooth, filtered noise to resemble a soft river
    function createBrownNoiseBuffer(duration = 4) {
      const sampleRate = audioCtx.sampleRate;
      const bufferSize = sampleRate * duration;
      const buffer = audioCtx.createBuffer(2, bufferSize, sampleRate);

      // Two channels with less smoothing and more high-frequency content
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        let last = 0;
        // reduce smoothing to allow more high-frequency energy (shower-like)
        const smooth = 0.008 + Math.random() * 0.006 + (ch * 0.001);
        const phaseOffset = Math.random() * Math.PI * 2;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          last = last + smooth * (white - last);
          // faster, slightly stronger modulation to emulate steady spray
          const t = i / sampleRate;
          const mod = 0.95 + 0.06 * Math.sin(2 * Math.PI * 0.6 * t + phaseOffset) + 0.03 * Math.sin(2 * Math.PI * 2.2 * t);
          // add a bit more HF sparkle to simulate water hitting surfaces
          data[i] = last * 0.6 * mod + (Math.random() * 2 - 1) * 0.018;
        }
      }
      return buffer;
    }

    function startBrownNoise() {
      if (brownSource) return;
      gainNode = audioCtx.createGain();
      // Audible bed under the music (was 0.08 — too quiet to hear).
      // The water lives in the bright spray band (~2500 Hz) while the
      // music sits low (130-700 Hz), so they don't mask each other.
      gainNode.gain.value = 0.20;
      gainNode.connect(audioCtx.destination);

      // gentle highpass to remove mud, then a mild band character for surface sparkle
      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 300; // cut low rumble for a clearer shower tone
      highpass.Q.value = 0.8;

      const band = audioCtx.createBiquadFilter();
      band.type = 'bandpass';
      band.frequency.value = 2500; // emphasize brighter surface spray
      band.Q.value = 1.2;

      // gentle lowpass to control extreme HF but keep shower shimmer
      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.value = 6000;
      lowpass.Q.value = 0.7;

      // add a subtle high-shelf boost for metallic/shower sparkle
      const highShelf = audioCtx.createBiquadFilter();
      highShelf.type = 'highshelf';
      highShelf.frequency.value = 7000;
      highShelf.gain.value = 6;

      brownSource = audioCtx.createBufferSource();
      brownSource.buffer = createBrownNoiseBuffer(4);
      brownSource.loop = true;

      // slight stereo spread: create splitter + merger and offset channels with tiny delay
      const splitter = audioCtx.createChannelSplitter(2);
      const merger = audioCtx.createChannelMerger(2);

      brownSource.connect(splitter);


      const delayL = audioCtx.createDelay();
      const delayR = audioCtx.createDelay();
      delayL.delayTime.value = 0.0;
      delayR.delayTime.value = 0.005; // small offset for tighter stereo spray

      splitter.connect(delayL, 0);
      splitter.connect(delayR, 1);

      delayL.connect(band);
      delayR.connect(band);

      band.connect(lowpass);
      lowpass.connect(highpass);
      highpass.connect(highShelf);
      highShelf.connect(gainNode);

      brownSource.start();
    }

    function stopBrownNoise() {
      if (!brownSource) return;
      try {

      gainNode = null;

      if(!musicGain) return;

        var t = when || audioCtx.currentTime;

        o.start(t); o.stop(t + dur + 0.05);
      }catch(e){}
    }
    // Soft bass pulse for the beat — a low note with a quick attack
    // (unlike the pad's slow fade-in) so each beat lands gently.
    function mbeat(midi, when){

      try{
        var t = when || audioCtx.currentTime;
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();

        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);   // quick attack
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(musicGain);
        o.start(t); o.stop(t + 0.55);
      }catch(e){}
    }
    // Soft piano for the melody — a sine note with a fast hammer
    // attack plus a very soft octave above, both decaying gently like
    // a piano string. Sine (not triangle) keeps it soft, not sharp.
    function mpiano(midi, dur, vol, when){
      if(!musicGain) return;
      try{
        var t = when || audioCtx.currentTime;
        var f = midiToFreq(midi);
        var o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = "sine"; o1.frequency.setValueAtTime(f, t);
        g1.gain.setValueAtTime(0.0001, t);
        g1.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g1.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o1.connect(g1); g1.connect(musicGain);
        o1.start(t); o1.stop(t + dur + 0.05);
        var o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = "sine"; o2.frequency.setValueAtTime(f * 2, t);
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(vol * 0.2, t + 0.01);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.6);
        o2.connect(g2); g2.connect(musicGain);
        o2.start(t); o2.stop(t + dur * 0.6 + 0.05);
      }catch(e){}
    }
    function musicScheduler(){
      if(!musicGain) return;
      while(musNextTime < audioCtx.currentTime + 0.15){
        var s = musStep % 128;   // 8 bars x 16 steps
        var bar = Math.floor(s / 16) % 4;
        if(s % 16 === 0){
          var chord = MUS_CHORDS[bar];
          for(var i = 0; i < chord.length; i++){
            mnote(chord[i], MUS_STEP * 16, "sine", 0.10, musNextTime);   // pad, one bar long
          }
        }
        // gentle bass pulse on every beat (the chord root, one octave down)
        if(s % 4 === 0){
          mbeat(MUS_CHORDS[bar][0] - 12, musNextTime);
        }
        var m = MUS_MELODY[s];
        if(m) mpiano(m, MUS_STEP * 6, 0.12, musNextTime);   // melody, soft piano
        musStep++;
        musNextTime += MUS_STEP;
      }
    }
    function musicStart(){

      pets.forEach(p => {
        p.x = Math.max(60, Math.min(width - 60, p.x));
        p.y = Math.max(60, Math.min(height - 60, p.y));
      });
      // Waves: drop any that ended up off-screen in the new size.
      // Their positions are from the old orientation, so after a
      // rotation they sit outside the frame — and they keep getting
      // drawn and distance-checked against every turtle, every frame.
      // Culling them here keeps the wave count (and the per-frame
      // work) from piling up across rotations.
      gameState.waves = gameState.waves.filter(w => w.x >= -80 && w.x <= width + 80 && w.y >= -80 && w.y <= height + 80);
    }

    const turtles = [
      { scaleMult: 1.0, timeOffset: 0, palette: PALETTES.darkTeal },
      { scaleMult: 0.65, timeOffset: 1500, palette: PALETTES.babyBlue },
      { scaleMult: 0.55, timeOffset: 5000, palette: PALETTES.cucumberGreen },
      { scaleMult: 0.8, timeOffset: 3200, palette: PALETTES.lightTeal },
      { scaleMult: 0.45, timeOffset: 7000, palette: PALETTES.babyBlue },
      { scaleMult: 0.75, timeOffset: 2100, palette: PALETTES.darkTeal },
      { scaleMult: 0.5, timeOffset: 8500, palette: PALETTES.lightTeal },
      { scaleMult: 0.6, timeOffset: 4100, palette: PALETTES.cucumberGreen },
      { scaleMult: 0.32, timeOffset: 1200, palette: PALETTES.babyBlue, isBaby: true },
      { scaleMult: 0.28, timeOffset: 2400, palette: PALETTES.cucumberGreen, isBaby: true },
      { scaleMult: 0.30, timeOffset: 3600, palette: PALETTES.lightTeal, isBaby: true },
      { scaleMult: 0.25, timeOffset: 4800, palette: PALETTES.darkTeal, isBaby: true },
      { scaleMult: 0.35, timeOffset: 6000, palette: PALETTES.babyBlue, isBaby: true },
      { scaleMult: 0.48, timeOffset: 9200, palette: PALETTES.kempsRidley },
      { scaleMult: 0.45, timeOffset: 10500, palette: PALETTES.kempsRidley },
      { scaleMult: 0.50, timeOffset: 11800, palette: PALETTES.kempsRidley },
      { scaleMult: 0.85, timeOffset: 13000, palette: PALETTES.greenSeaTurtle, hasSpots: true },
      { scaleMult: 0.80, timeOffset: 14500, palette: PALETTES.greenSeaTurtle },
      { scaleMult: 0.75, timeOffset: 16000, palette: PALETTES.greenSeaTurtle }
    ].map((t, i) => {
      const spd = t.isBaby ? (1.2 + Math.random() * 0.8) * t.scaleMult : (0.4 + Math.random() * 0.5) * t.scaleMult;
      return {
        ...t,
        // Tamagotchi: every turtle starts as a little baby (half its
        // full size) with empty hearts. Feed it and pet it to fill its
        // hearts; when they're full it grows to its full size.
        adultScale: t.scaleMult,
        scaleMult: t.scaleMult * 0.5,
        hearts: 0,
        grown: false,
        heartShow: 0,
        // Needs: every once in a while a turtle needs something — a
        // broken heart (it needs love), a cucumber (it's hungry), or a
        // hand (it wants a pat on the head). The icon floats above it
        // until you help. needTimer counts down to the next need.
        need: null,
        needTimer: (20 + Math.random() * 25) * 60,
        // at night, every other turtle swims away to sleep, so the
        // jellyfish have room (only in nighttime mode)
        nightSleeper: i % 2 === 1,
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        angle: Math.random() * Math.PI * 2,
        targetAngle: Math.random() * Math.PI * 2,
        speed: spd,
        baseSpeed: spd
        ,offscreenTime: 0
      };
    });

    // (Resize is handled by the debounced onResize above, which calls
    // resetTurtlePositions after the canvas settles.)

    // --- Drawing Helper Functions ---
    // A soft shadow under each turtle. This used to be a ctx.filter blur,
    // but a 40px blur drawn 19 times a frame is the single most expensive
    // thing in the game on a Chromebook — a radial gradient that fades
    // from dark to transparent looks the same and costs almost nothing.
    const drawShadow = (ctx) => {
      ctx.save();
      ctx.translate(80, 100);
      ctx.scale(1, 1.15);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 150);
      g.addColorStop(0, 'rgba(0, 5, 15, 0.4)');
      g.addColorStop(1, 'rgba(0, 5, 15, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 150, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };

    // Helper to calculate a point on a cubic bezier curve for perfect edge tracing
    const getBezierPoint = (t, p0, p1, p2, p3) => {
      const cT = 1 - t;
      return (Math.pow(cT, 3) * p0) + (3 * Math.pow(cT, 2) * t * p1) + (3 * cT * Math.pow(t, 2) * p2) + (Math.pow(t, 3) * p3);
    };

    const drawBackFlippers = (ctx, time, palette, hasSpots = false) => {
      const sweep = Math.sin(time * 0.002 - Math.PI / 4);
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.translate(side * 50, 120);
        ctx.rotate(side * (-sweep * 0.15 - 0.1));
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(side * 50, 20, side * 70, 90, side * 40, 120);
        ctx.bezierCurveTo(side * 10, 100, side * -10, 40, 0, 0);
        const grad = ctx.createLinearGradient(0, 0, side * 40, 120);
        grad.addColorStop(0, palette.backFinBase);
        grad.addColorStop(1, palette.backFinShadow);
        ctx.fillStyle = grad;
        ctx.fill();
        
        ctx.clip();
        // Use the turtle's own shadow color for perfectly blended spots
        ctx.fillStyle = palette.headShad; 
        
        // Outer edge spots
        for (let i = 1; i <= 8; i++) {
          const t = i / 9;
          const px = getBezierPoint(t, 0, side * 50, side * 70, side * 40);
          const py = getBezierPoint(t, 0, 20, 90, 120);
          const r = 2.5 + t * 2.0;
          ctx.beginPath();
          for (let j = 0; j < 6; j++) {
            const angle = (Math.PI * 2 / 6) * j + (i * side);
            // Use math to create a stable but irregular, blocky scale shape
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 3 + j * 5)));
            const sx = px - side * 5 + Math.cos(angle) * dist;
            const sy = py + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }
        
        // Inner edge spots
        for (let i = 1; i <= 7; i++) {
          const t = i / 8;
          const px = getBezierPoint(t, side * 40, side * 10, side * -10, 0);
          const py = getBezierPoint(t, 120, 100, 40, 0);
          const r = 1.5 + (1-t) * 1.5;
          ctx.beginPath();
          for (let j = 0; j < 5; j++) {
            const angle = (Math.PI * 2 / 5) * j + (i * 1.2 * side);
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 4 + j * 2)));
            const sx = px + side * 5 + Math.cos(angle) * dist;
            const sy = py - 3 + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }

        // Interior / Middle spots
        for (let u of [0.35, 0.65]) {
          const count = u === 0.35 ? 7 : 6;
          for (let i = 1; i <= count; i++) {
            const t = (i + (u === 0.35 ? 0 : 0.5)) / (count + 1);
            if (t >= 1.0) continue;
            
            const pxOut = getBezierPoint(t, 0, side * 50, side * 70, side * 40);
            const pyOut = getBezierPoint(t, 0, 20, 90, 120);
            const pxIn = getBezierPoint(1-t, side * 40, side * 10, side * -10, 0);
            const pyIn = getBezierPoint(1-t, 120, 100, 40, 0);

            // Interpolate perfectly between the outer and inner curves
            const px = pxOut + (pxIn - pxOut) * u;
            const py = pyOut + (pyIn - pyOut) * u;
            const r = 2.5 + Math.sin(t * Math.PI) * 2.5; 

            ctx.beginPath();
            for (let j = 0; j < 5; j++) {
              const angle = (Math.PI * 2 / 5) * j + (i * side * u);
              const dist = r * (0.7 + 0.4 * Math.abs(Math.sin(i * 3 + j * 2 + u * 10)));
              const sx = px + Math.cos(angle) * dist;
              const sy = py + Math.sin(angle) * dist;
              if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.fill();
          }
        }
        
        ctx.restore();
      }
    };

    const drawHead = (ctx, time, palette) => {
      const nod = Math.sin(time * 0.001) * 0.04;
      ctx.save();
      ctx.translate(0, -135);
      ctx.rotate(nod);
      
      ctx.beginPath();
      ctx.moveTo(-25, 20); ctx.lineTo(25, 20); ctx.lineTo(20, -20); ctx.lineTo(-20, -20);
      ctx.fillStyle = palette.neck;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, -30, 32, 42, 0, 0, Math.PI * 2);
      const headGrad = ctx.createRadialGradient(-10, -40, 5, 0, -30, 42);
      headGrad.addColorStop(0, palette.headHi);
      headGrad.addColorStop(0.6, palette.headMid);
      headGrad.addColorStop(1, palette.headShad);
      ctx.fillStyle = headGrad;
      ctx.fill();

      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(side * 24, -38, 4, 7, side * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#080808';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(side * 23, -40, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.moveTo(-12, -68); ctx.lineTo(12, -68); ctx.lineTo(0, -82);
      ctx.fillStyle = palette.beak;
      ctx.fill();
      ctx.restore();
    };

    const drawFrontFlippers = (ctx, time, palette, hasSpots = false) => {
      const sweep = Math.sin(time * 0.0015);
      const flex = Math.cos(time * 0.0015);
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.translate(side * 75, -50);
        ctx.rotate(side * (sweep * 0.25 + 0.15));
        
        const cp1x = side * 90, cp1y = -20;
        const cp2x = side * 200 + flex * 15, cp2y = 30 + sweep * 25;
        const endX = side * 240, endY = 130;
        
        const cp3x = side * 150, cp3y = 110;
        const cp4x = side * 50, cp4y = 70;
        const startX2 = 0, startY2 = 50;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
        ctx.bezierCurveTo(cp3x, cp3y, cp4x, cp4y, startX2, startY2);
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, -20, side * 240, 130);
        grad.addColorStop(0, palette.frontFinInner);
        grad.addColorStop(0.4, palette.frontFinMid);
        grad.addColorStop(1, palette.frontFinTip);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.clip();
        // Use the turtle's own shadow color for perfectly blended spots
        ctx.fillStyle = palette.headShad;

        // Leading edge spots
        for (let i = 1; i <= 15; i++) {
          const t = i / 16;
          const px = getBezierPoint(t, 0, cp1x, cp2x, endX);
          const py = getBezierPoint(t, 0, cp1y, cp2y, endY);
          const r = 2.5 + t * 3.5;
          ctx.beginPath();
          for(let j = 0; j < 6; j++) {
            const angle = (Math.PI * 2 / 6) * j + (i * 0.5 * side);
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 7 + j * 3)));
            const sx = px - side * 6 + Math.cos(angle) * dist;
            const sy = py + 6 + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }

        // Trailing edge spots
        for (let i = 1; i <= 13; i++) {
          const t = i / 14;
          const px = getBezierPoint(t, endX, cp3x, cp4x, startX2);
          const py = getBezierPoint(t, endY, cp3y, cp4y, startY2);
          const r = 2 + t * 2; 
          ctx.beginPath();
          for(let j = 0; j < 5; j++) {
            const angle = (Math.PI * 2 / 5) * j + (i * 0.8 * side);
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 4 + j * 2)));
            const sx = px - side * 2 + Math.cos(angle) * dist;
            const sy = py - 6 + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }

        // Interior / Middle veins
        const numVeins = 3;
        for (let v = 1; v <= numVeins; v++) {
          const u = v / (numVeins + 1); 
          const spotCount = 15 - Math.abs(v - 2) * 3; 
          for (let i = 1; i <= spotCount; i++) {
            // Offset the rows slightly so they interlock
            const t = (i + (v % 2) * 0.5) / (spotCount + 1);
            if (t >= 1.0) continue;

            const px1 = getBezierPoint(t, 0, cp1x, cp2x, endX);
            const py1 = getBezierPoint(t, 0, cp1y, cp2y, endY);
            const px2 = getBezierPoint(1-t, endX, cp3x, cp4x, startX2);
            const py2 = getBezierPoint(1-t, endY, cp3y, cp4y, startY2);

            // Interpolate perfectly between the leading and trailing edges
            const px = px1 + (px2 - px1) * u;
            const py = py1 + (py2 - py1) * u;
            // Make spots larger in the thick middle section of the flipper
            const r = 2.5 + Math.sin(t * Math.PI) * 4.5; 

            ctx.beginPath();
            for(let j = 0; j < 6; j++) {
              const angle = (Math.PI * 2 / 6) * j + (i * 0.6 * side * u);
              const dist = r * (0.7 + 0.4 * Math.abs(Math.sin(i * 5 + j * 3 + v * 7)));
              const sx = px + Math.cos(angle) * dist;
              const sy = py + Math.sin(angle) * dist;
              if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.fill();
          }
        }
        
        ctx.restore();
      }
    };

    const drawShell = (ctx, time, palette) => {
      ctx.save();
      ctx.beginPath();
      ctx.scale(1, 1.18);
      ctx.arc(0, 0, 135, 0, Math.PI * 2);
      ctx.restore();

      const shellGrad = ctx.createRadialGradient(-30, -30, 20, 0, 0, 155);
      shellGrad.addColorStop(0, palette.shellPeak);
      shellGrad.addColorStop(0.3, palette.shellMid);
      shellGrad.addColorStop(0.7, palette.shellBase);
      shellGrad.addColorStop(1, palette.shellRim);
      
      // The shell's edge already has a dark stroke for definition (below),
      // so no shadowBlur is needed here — it was blurring all 19 shells
      // every frame, which is expensive on a Chromebook.
      ctx.fillStyle = shellGrad;
      ctx.fill();

      // Added explicit dark stroke to ensure shading around the edges of all shells
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0, 15, 5, 0.5)';
      ctx.stroke();

      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(0, i * 45, 40 - Math.abs(i) * 6, 28, 0, 0, Math.PI * 2);
        const hGrad = ctx.createLinearGradient(0, i * 45 - 28, 0, i * 45 + 28);
        hGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
        hGrad.addColorStop(1, 'rgba(0, 0, 0, 0.25)');
        ctx.fillStyle = hGrad;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.stroke();
      }

      for (const side of [-1, 1]) {
        for (let i = -1.5; i <= 1.5; i++) {
          ctx.beginPath();
          ctx.ellipse(side * 60, i * 50, 28, 40, side * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
          ctx.fill();
          ctx.stroke();
        }
      }

      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.beginPath();
      ctx.scale(1, 1.18);
      ctx.arc(0, 0, 135, 0, Math.PI * 2);
      ctx.restore();
      ctx.clip();

      const cTime = time * 0.001;
      ctx.fillStyle = 'rgba(160, 220, 255, 0.15)';
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(
          Math.sin(cTime + i) * 80,
          Math.cos(cTime * 0.8 + i * 2) * 100,
          40 + Math.sin(i) * 20,
          0, Math.PI * 2
        );
        ctx.fill();
      }
      ctx.restore();
    };

    // A little pink heart (for happy turtles).
    function drawHeart(ctx, x, y, s, alpha){
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s / 10, s / 10);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff6b9d';
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.bezierCurveTo(-6, -4, -12, 3, 0, 10);
      ctx.bezierCurveTo(12, 3, 6, -4, 0, 3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Tamagotchi care: feed or pet a turtle to fill its hearts. When
    // its hearts are full it grows up to its full size (and celebrates
    // with a happy spin). Already-grown turtles just stay grown.
    // The hearts meter only shows for a few seconds after you care for
    // it — it's hidden the rest of the time.
    // Needs: the little icons that float above a turtle when it wants
    // something — 💔 love, 🥒 food, ✋ a pat on the head. When you help,
    // the need clears and the next one comes in a little while.
    const NEED_ICON = { love: '💔', food: '🥒', pat: '✋' };
    function clearNeed(t){
      t.need = null;
      t.needTimer = (25 + Math.random() * 35) * 60;
    }
    function careFor(t, amount){
      t.heartShow = 240;
      if (t.grown) return;
      t.hearts = Math.min(100, (t.hearts || 0) + amount);
      if (t.hearts >= 100) {
        t.grown = true;
        t.scaleMult = t.adultScale;
        t.happy = 180;
        t.happySpin = 0;
      }
    }

    const drawRealisticTurtle = (ctx, globalTime, width, height, t) => {
      const time = globalTime + t.timeOffset;
      const hoverY = Math.sin(time * 0.001) * 10;
      const hoverX = Math.cos(time * 0.0008) * 10;
      const swimWobble = Math.sin(time * 0.0015) * 0.08;
      // while happy, the turtle spins with joy on top of its swim angle
      const happySpin = t.happy > 0 ? (t.happySpin || 0) : 0;

      ctx.save();
      ctx.translate(t.x + hoverX, t.y + hoverY);
      ctx.rotate(t.angle + Math.PI / 2 + swimWobble + happySpin);

      // Use the minimum of width and height for scaling to prevent stretching
      const scale = Math.min(1, Math.min(width, height) / 900) * 0.5 * t.scaleMult;
      ctx.scale(scale, scale);

      drawShadow(ctx);
      drawBackFlippers(ctx, time, t.palette, t.hasSpots);
      drawHead(ctx, time, t.palette);
      drawFrontFlippers(ctx, time, t.palette, t.hasSpots);
      drawShell(ctx, time, t.palette);

      ctx.restore();

      // happy hearts: two little hearts float up and fade while the
      // turtle is happy after eating
      if (t.happy > 0) {
        const prog = (180 - t.happy) / 180;
        drawHeart(ctx, t.x - 12, t.y - 28 - prog * 45, 9, Math.max(0, 1 - prog));
        drawHeart(ctx, t.x + 14, t.y - 34 - prog * 55, 7, Math.max(0, 1 - prog * 0.8));
      }

      // Tamagotchi hearts meter: a tiny bar above a baby turtle showing
      // how full its hearts are. It's hidden until you feed or pet the
      // turtle, then it pops up for a few seconds and fades away. It's
      // kept small and soft so it doesn't stand out on its own.
      if (!t.grown && t.heartShow > 0) {
        const bw = 26, bh = 3, bx = t.x - bw / 2, by = t.y - 42;
        const fade = Math.min(1, t.heartShow / 60) * 0.75;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.fillStyle = 'rgba(0, 20, 20, 0.45)';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 1.5);
        ctx.fill();
        ctx.fillStyle = '#ff6b9d';
        ctx.beginPath();
        ctx.roundRect(bx, by, Math.max(0, bw * ((t.hearts || 0) / 100)), bh, 1.5);
        ctx.fill();
        ctx.restore();
      }
    };

    // --- Rare visitors: stingray, baby stingray, baby whale shark ---
    // They swim through every once in a while (rare), one at a time,
    // sometimes a couple together. They ignore waves and cucumber;
    // they eat seaweed when it's offered while they're passing through.
    const visitors = [];
    const splashes = [];
    let nextVisitorAt = 0;   // rAF timestamp of the next spawn
    let firstVisitDone = false;   // the very first visitor is always a whale shark
    let foodKind = 'cucumber';   // 'cucumber' normally, 'seaweed' while a visitor is here
    let foodBtnKind = 'cucumber'; // what the food button currently shows
    let foodManual = null;       // set by double-tapping the food button: 'cucumber' or 'seaweed' (null = automatic)

    // --- Glowing jellyfish (night only) ---
    // They drift up through the lagoon at night, each a different
    // colour, gently pulsing. Tap one and it lights up brightly.
    const JELLY_COLORS = [
      { color: '#ff7eb6', light: '#ffb3d1' },  // pink
      { color: '#b388ff', light: '#d1b3ff' },  // purple
      { color: '#4fc3f7', light: '#a5e1ff' },  // blue
      { color: '#4dd0e1', light: '#a5ecf5' },  // cyan
      { color: '#81c784', light: '#c8e6c9' },  // green
      { color: '#ffb74d', light: '#ffe0b2' }   // orange
    ];
    const jellyfish = [];

    // --- Treasures to collect: shells + starfish on the seafloor ---
    // Tap one to collect it; the counter (top-left) counts them, and a
    // new one washes up so there's always something to find.
    const collectibles = [];
    let shellCount = 0, starCount = 0;
    function updateTreasureCount(){
      const sh = document.getElementById('menuShells');
      const st = document.getElementById('menuStars');
      if (sh) sh.textContent = shellCount;
      if (st) st.textContent = starCount;
    }

    // --- Animal unlocks: collect 1,000 shells OR 1,000 starfish and a
    // new animal is waiting for you! A little notification tells you to
    // check your menu, and in the menu there's a mystery shell — tap it
    // twice to crack it open and reveal your animal. Which animal you
    // get is a surprise: a seahorse, a baby otter, or a baby octopus,
    // picked at random. Your counts and animals are saved on your
    // device, so your progress is still there when you come back.
    const SAVE_KEY = 'seaTurtleParadise_save_v1';
    const UNLOCK_KINDS = ['seahorse', 'otter', 'octopus'];
    const UNLOCK_EMOJI = { seahorse: '🌊', otter: '🦦', octopus: '🐙' };
    const UNLOCK_NAME = { seahorse: 'a seahorse', otter: 'a baby otter', octopus: 'a baby octopus' };
    const UNLOCK_LABEL = { seahorse: '🌊 Seahorse', otter: '🦦 Baby otter', octopus: '🐙 Baby octopus' };
    let unlocksEarned = 0, unlocksClaimed = 0, unlockPending = false;
    const pets = [];
    function saveGame(){
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          shellCount, starCount,
          unlocksEarned, unlocksClaimed, unlockPending,
          pets: pets.map(p => p.kind)
        }));
      } catch (e) {}
    }
    function loadGame(){
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const d = JSON.parse(raw);
        if (typeof d.shellCount === 'number') shellCount = d.shellCount;
        if (typeof d.starCount === 'number') starCount = d.starCount;
        if (typeof d.unlocksEarned === 'number') unlocksEarned = d.unlocksEarned;
        if (typeof d.unlocksClaimed === 'number') unlocksClaimed = d.unlocksClaimed;
        if (typeof d.unlockPending === 'boolean') unlockPending = d.unlockPending;
        if (Array.isArray(d.pets)) d.pets.forEach(k => { if (UNLOCK_KINDS.includes(k)) spawnPet(k); });
      } catch (e) {}
    }
    function updateMenuUnlock(){
      const sec = document.getElementById('unlockSection');
      const list = document.getElementById('petList');
      const hint = document.getElementById('petHint');
      if (sec) sec.classList.toggle('hidden', !unlockPending);
      if (list) {
        list.innerHTML = pets.map(p => `<div>${UNLOCK_LABEL[p.kind] || p.kind}</div>`).join('');
      }
      if (hint) hint.classList.toggle('hidden', pets.length > 0);
    }
    let toastTimer = null;
    function showUnlockToast(){
      const t = document.getElementById('unlockToast');
      if (!t) return;
      t.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add('hidden'), 12000);
    }
    function checkUnlock(){
      const milestones = Math.floor(shellCount / 1000) + Math.floor(starCount / 1000);
      if (milestones > unlocksEarned) {
        unlocksEarned = milestones;
        unlockPending = true;
        showUnlockToast();
        updateMenuUnlock();
        saveGame();
      }
    }
    function spawnCollectible(width, height){
      const kind = Math.random() < 0.5 ? 'shell' : 'starfish';
      collectibles.push({
        x: 50 + Math.random() * (width - 100),
        y: height * 0.75 + Math.random() * (height * 0.22),
        kind: kind,
        size: kind === 'shell' ? 14 + Math.random() * 6 : 13 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        phase: Math.random() * 1000
      });
    }
    function updateCollectibles(time, dt, width, height){
      while (collectibles.length < 5) spawnCollectible(width, height);
    }
    function drawCollectible(ctx, time, c){
      const bob = Math.sin(time * 0.001 + c.phase) * 2;
      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.rotate(c.rot);
      if (c.kind === 'shell') {
        // a spiral seashell: a round shell with a coil inside
        // (like a conch — not an orange slice)
        ctx.fillStyle = '#f5d0a9';
        ctx.strokeStyle = '#d9a066';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, c.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#c98a5a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let a = 0; a <= 3 * Math.PI * 2; a += 0.15) {
          const r = (a / (3 * Math.PI * 2)) * c.size * 0.85;
          const x = Math.cos(a) * r;
          const y = Math.sin(a) * r;
          if (a === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      } else {
        // a starfish: a five-pointed star
        ctx.fillStyle = '#ff9e7d';
        ctx.strokeStyle = '#e07a5f';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const a = -Math.PI / 2 + k * (Math.PI * 2 / 5);
          const a2 = a + Math.PI / 5;
          const ox = Math.cos(a) * c.size, oy = Math.sin(a) * c.size;
          const ix = Math.cos(a2) * c.size * 0.45, iy = Math.sin(a2) * c.size * 0.45;
          if (k === 0) ctx.moveTo(ox, oy);
          else ctx.lineTo(ox, oy);
          ctx.lineTo(ix, iy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    // The food button's two icons (cucumber slice / seaweed sprig).
    const CUCUMBER_SVG = `<svg viewBox="0 0 24 24" fill="none" class="w-8 h-8"><circle cx="12" cy="12" r="10" fill="#134d24" stroke="#0a2e12" stroke-width="0.5"/><circle cx="12" cy="12" r="8.5" fill="#7dce94" /><circle cx="12" cy="12" r="7" fill="#e2f5e6" /><path d="M12 12 Q 15 8 16 12 Q 15 16 12 12" fill="#b6e3c4" transform="rotate(0 12 12)"/><path d="M12 12 Q 15 8 16 12 Q 15 16 12 12" fill="#b6e3c4" transform="rotate(120 12 12)"/><path d="M12 12 Q 15 8 16 12 Q 15 16 12 12" fill="#b6e3c4" transform="rotate(240 12 12)"/><ellipse cx="14" cy="11.5" rx="0.8" ry="0.4" fill="#fff" transform="rotate(30 14 11.5)"/><ellipse cx="14" cy="12.5" rx="0.8" ry="0.4" fill="#fff" transform="rotate(-30 14 12.5)"/><ellipse cx="10" cy="10" rx="0.8" ry="0.4" fill="#fff" transform="rotate(150 10 10)"/><ellipse cx="11" cy="9" rx="0.8" ry="0.4" fill="#fff" transform="rotate(90 11 9)"/><ellipse cx="10" cy="14" rx="0.8" ry="0.4" fill="#fff" transform="rotate(210 10 14)"/><ellipse cx="11" cy="15" rx="0.8" ry="0.4" fill="#fff" transform="rotate(270 11 15)"/></svg>`;
    const SEAWEED_SVG = `<svg viewBox="0 0 24 24" fill="none" class="w-8 h-8"><path d="M7 21 C 5 16, 9 12, 7 7 C 6 4, 8 2, 8 2" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/><path d="M12 21 C 10 15, 14 11, 12 6 C 11 3, 13 2, 13 2" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/><path d="M17 21 C 15 16, 19 13, 17 8 C 16 5, 18 3, 18 3" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/></svg>`;

    // While a visitor is here the food button turns into seaweed (to feed
    // them); when they leave it turns back into cucumber (for the turtles).
    // Any uneaten seaweed turns back into cucumbers when the food is
    // cucumber again. Double-tapping the food button picks the food
    // yourself (foodManual) and overrides the automatic switch until
    // you double-tap it again.
    function updateFoodButton(){
      const want = foodManual || (visitors.length > 0 ? 'seaweed' : 'cucumber');
      if (want === foodBtnKind) return;
      foodBtnKind = want;
      foodKind = want;
      foodBtn.innerHTML = want === 'seaweed' ? SEAWEED_SVG : CUCUMBER_SVG;
      foodBtn.title = want === 'seaweed' ? 'Feed seaweed to the visitors' : 'Feeding Mode';
      foodBtn.setAttribute('aria-label', foodBtn.title);
      if (want === 'cucumber') {
        // uneaten seaweed turns back into cucumbers (for the turtles)
        // instead of just vanishing
        gameState.food.forEach(f => { if (f.kind === 'seaweed') { f.kind = 'cucumber'; f.targetSize = 7; } });
      }
    }

    // A tiny splash of water (droplets + a gentle ring) for when the
    // baby whale shark enters or leaves.
    function makeSplash(x, y){
      splashes.push({ x, y, age: 0, life: 50 });
      pushWave({ x, y, age: 0, life: 70, speed: 1.6, source: 'splash' });
    }

    function spawnVisitor(kind, x, y, dir){
      const base = {
        stingray:     { speed: 0.55, scale: 0.9 },
        babyStingray: { speed: 0.50, scale: 0.5 },
        whaleShark:   { speed: 0.50, scale: 1.0 }
      }[kind];
      const v = {
        kind, x, y, dir,
        speed: base.speed, scale: base.scale,
        angle: dir === 1 ? 0 : Math.PI,
        targetAngle: dir === 1 ? 0 : Math.PI,
        phase: Math.random() * Math.PI * 2,
        timeOffset: Math.random() * 10000
      };
      visitors.push(v);
      if (kind === 'whaleShark') makeSplash(x, y);
      return v;
    }

    function scheduleVisitors(time, width, height){
      if (nextVisitorAt === 0) {
        // first visit comes soon (12-18s) so you don't have to wait to see one
        nextVisitorAt = time + 12000 + Math.random() * 6000;
        return;
      }
      if (time < nextVisitorAt) return;
      if (visitors.length > 0) return;   // one visit at a time
      const dir = Math.random() < 0.5 ? 1 : -1;
      const y = height * (0.15 + Math.random() * 0.65);
      const x = dir === 1 ? -260 : width + 260;
      // whale shark 40%, baby stingray 35%, stingray 25% — the whale
      // shark is the star, so it shows up the most. The very first
      // visitor is always a whale shark, so you meet one right away.
      const r = Math.random();
      let kind;
      if (!firstVisitDone) { kind = 'whaleShark'; firstVisitDone = true; }
      else { kind = r < 0.4 ? 'whaleShark' : r < 0.75 ? 'babyStingray' : 'stingray'; }
      spawnVisitor(kind, x, y, dir);
      // sometimes a couple swims through together (30%)
      if (Math.random() < 0.3) {
        const r2 = Math.random();
        const kind2 = r2 < 0.4 ? 'whaleShark' : r2 < 0.75 ? 'babyStingray' : 'stingray';
        const y2 = Math.min(height * 0.85, Math.max(height * 0.15, y + (Math.random() < 0.5 ? -1 : 1) * (90 + Math.random() * 70)));
        spawnVisitor(kind2, x - dir * (180 + Math.random() * 100), y2, dir);
      }
      // the gap to the next visit starts when THIS visit ends
      // (see updateVisitors) — not here, or visits would run back-to-back
    }

    function updateVisitors(time, dt, width, height){
      scheduleVisitors(time, width, height);
      const hadVisitors = visitors.length > 0;
      for (let i = visitors.length - 1; i >= 0; i--) {
        const v = visitors[i];
        // steer toward nearby seaweed (only if it's roughly ahead of it)
        let target = null;
        if (gameState.food.length > 0) {
          let best = null, bestD = Infinity;
          gameState.food.forEach((f, idx) => {
            if (f.kind !== 'seaweed') return;
            const dx = f.x - v.x, dy = f.y - v.y;
            const d = Math.hypot(dx, dy);
            const ang = Math.atan2(dy, dx);
            let diff = ang - v.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            if (Math.abs(diff) < 1.75 && d < bestD) { bestD = d; best = { f, idx, d }; }
          });
          if (best && bestD < 600) target = best;
        }
        if (target) {
          v.targetAngle = Math.atan2(target.f.y - v.y, target.f.x - v.x);
          if (target.d < 70 * v.scale) gameState.food.splice(target.idx, 1);
        } else {
          v.targetAngle = v.dir === 1 ? 0 : Math.PI;
        }
        let diff = v.targetAngle - v.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        v.angle += diff * 0.03 * dt;
        v.x += Math.cos(v.angle) * v.speed * dt;
        v.y += Math.sin(v.angle) * v.speed * dt;
        // Rocks are solid: if a visitor is about to swim under the
        // waterfall, push it down below the rocks and the cliff face.
        // We check the head (the front of the animal) so the push
        // happens just as it reaches the rocks, and the margin clears
        // its body height.
        const rb = rockBounds(width, height);
        const headX = v.x + Math.cos(v.angle) * 190 * v.scale;
        const headY = v.y + Math.sin(v.angle) * 190 * v.scale;
        const bodyR = 110 * v.scale + 15;
        if (headX > rb.x0 && headX < rb.x1 && headY > rb.y0 && headY < rb.y1 + bodyR) {
          v.y = rb.y1 + bodyR;
        }
        // keep it in the water vertically; if it drifts to an edge, turn it back
        if (v.y < 50 || v.y > height - 50) {
          v.y = Math.max(50, Math.min(height - 50, v.y));
          v.angle = v.dir === 1 ? 0 : Math.PI;
        }
        // off the far edge = it has left; the whale shark splashes as it goes
        if ((v.dir === 1 && v.x > width + 320) || (v.dir === -1 && v.x < -320)) {
          if (v.kind === 'whaleShark') makeSplash(v.dir === 1 ? width - 10 : 10, v.y);
          visitors.splice(i, 1);
        }
      }
      // a visit just ended — the next one comes in 60-120s (rare)
      if (hadVisitors && visitors.length === 0) {
        nextVisitorAt = time + 60000 + Math.random() * 60000;
      }
      updateFoodButton();
    }

    // Glowing jellyfish — night only. They drift slowly upward through
    // the lagoon, each a different colour, gently pulsing. Tap one and
    // it flares bright for a moment. They fade out when day comes.
    function updateJellyfish(time, dt, width, height){
      const isNight = theme === 'night';
      // at night they're already there, spread through the lagoon
      // (not drifting in from the bottom) — fill up fast when night starts.
      // Some of them are babies: smaller, and they drift and pulse a
      // little faster, like little baby jellyfish following the big ones.
      if (isNight && jellyfish.length < 6 && Math.random() < 0.08 * dt) {
        const c = JELLY_COLORS[Math.floor(Math.random() * JELLY_COLORS.length)];
        // every jellyfish starts as a baby and grows up: it spawns small
        // (12–18) with a target adult size (22–40), then grows a little
        // each frame until it reaches that size and becomes an adult.
        jellyfish.push({
          x: 60 + Math.random() * (width - 120),
          y: 80 + Math.random() * (height - 160),
          // babies only — no adults, and they stay babies (they used
          // to grow into adults, but Brant wants just baby jellyfish)
          size: 12 + Math.random() * 6,
          color: c.color, light: c.light,
          phase: Math.random() * 1000,
          lit: 0, alpha: 0,
          drift: 0.25 + Math.random() * 0.25,
          baby: true
        });
      }
      for (let i = jellyfish.length - 1; i >= 0; i--) {
        const j = jellyfish[i];
        j.alpha += (isNight ? 0.03 : -0.03) * dt;
        if (j.alpha <= 0 && !isNight) { jellyfish.splice(i, 1); continue; }
        j.alpha = Math.max(0, Math.min(1, j.alpha));
        j.y -= j.drift * dt;
        j.x += Math.sin(time * 0.0008 + j.phase) * 0.3 * dt;
        if (j.lit > 0) j.lit = Math.max(0, j.lit - 0.01 * dt);
        // stay inside the frame: when one drifts up to the top edge it
        // cycles back to the bottom (in frame, not below it), and the
        // sideways sway is clamped so it can't drift off the sides
        if (j.y < j.size + 8) { j.y = height - j.size - 8; j.x = 60 + Math.random() * (width - 120); }
        j.x = Math.max(j.size + 8, Math.min(width - j.size - 8, j.x));
      }
    }
    function drawJellyfish(ctx, time, j){
      const t = time + j.phase;
      // babies pulse a little faster than the big ones
      const pr = j.baby ? 0.0032 : 0.002;
      const pulse = 0.5 + 0.5 * Math.sin(t * pr);
      const glow = 0.35 + 0.45 * pulse + j.lit * 0.6;
      const r = j.size;
      // the bell gently pulses (squeezes in and out) as it swims
      const squeeze = 1 + Math.sin(t * pr) * 0.08;
      ctx.save();
      ctx.translate(j.x, j.y);
      ctx.globalAlpha = j.alpha;
      // glow halo: a soft radial glow behind the bell. (This used to be
      // a big shadowBlur, but that made the game lag on Chromebooks —
      // a plain radial gradient looks the same and is much faster.)
      const halo = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.2);
      halo.addColorStop(0, j.color);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = j.alpha * (0.25 + 0.35 * glow);
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
      ctx.fill();
      // bell: a smooth glowing translucent dome, like a moon jellyfish
      // — bright in the middle, fading to see-through at the rim
      const grad = ctx.createRadialGradient(0, -r * 0.35, r * 0.05, 0, 0, r * 1.15);
      grad.addColorStop(0, j.light);
      grad.addColorStop(0.45, j.color);
      grad.addColorStop(1, j.color);
      ctx.globalAlpha = j.alpha * (0.55 + 0.3 * glow);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      // a bright glowing rim around the bell's edge
      ctx.globalAlpha = j.alpha;
      ctx.strokeStyle = j.light;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI, 0);
      ctx.stroke();
      // a soft glowing core inside the bell
      ctx.globalAlpha = j.alpha * (0.5 + 0.4 * pulse);
      ctx.fillStyle = j.light;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.35, r * 0.35, r * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = j.alpha;
      // tentacles: many long, thin, flowing threads hanging from the
      // rim, waving gently — like the glowing jellyfish in the photos
      ctx.strokeStyle = j.color;
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';
      for (let k = -6; k <= 6; k++) {
        const sway = Math.sin(t * 0.003 + k * 0.8) * r * 0.22;
        const sway2 = Math.sin(t * 0.002 + k * 1.7) * r * 0.3;
        const len = r * (2.0 + (Math.abs(k) % 3) * 0.35);
        ctx.beginPath();
        ctx.moveTo(k * r * 0.14, r * 0.05);
        ctx.bezierCurveTo(k * r * 0.14 + sway, r * 0.8, k * r * 0.14 + sway2, r * 1.4, k * r * 0.14 + sway2 * 1.3, len);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Seaweed sprig (what the visitors eat) — a few wavy green blades.
    function drawSeaweed(ctx, f){
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.shadowColor = 'rgba(0, 15, 30, 0.7)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 3;
      const s = f.size;
      ctx.lineCap = 'round';
      const blades = [
        { x: -s * 0.5, c: '#22c55e', w: 2.2 },
        { x: 0,        c: '#16a34a', w: 2.6 },
        { x: s * 0.5,  c: '#4ade80', w: 2.2 }
      ];
      blades.forEach((b, i) => {
        ctx.beginPath();
        ctx.moveTo(b.x, s * 0.8);
        ctx.bezierCurveTo(b.x - s * 0.3, s * 0.2, b.x + s * 0.3, -s * 0.2, b.x + (i - 1) * s * 0.15, -s * 0.9);
        ctx.strokeStyle = b.c;
        ctx.lineWidth = Math.max(1, b.w * (s / 9));
        ctx.stroke();
      });
      ctx.restore();
    }

    // Stingray, top-down, facing +x in local space (the caller rotates it
    // to the travel direction). The baby stingray uses the same drawing
    // at a smaller scale. Blue-grey diamond body, long whip tail.
    function drawStingray(ctx, time, v){
      const t = time + v.timeOffset;
      const flap = Math.sin(t * 0.004 + v.phase) * 5;
      const wobble = Math.sin(t * 0.002 + v.phase) * 0.04;
      const sc = Math.min(1, Math.min(canvas.width, canvas.height) / 900) * v.scale;
      ctx.save();
      ctx.translate(v.x, v.y + Math.sin(t * 0.001) * 6);
      ctx.rotate(v.angle + wobble);
      ctx.scale(sc, sc);
      // tail first (so the body overlaps its base) — a thin whip that sways
      ctx.strokeStyle = '#6b7f92';
      ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const x0 = -85 - i * 18;
        const y0 = Math.sin(t * 0.006 + i * 0.9) * 6 * (i / 6);
        const x1 = -85 - (i + 1) * 18;
        const y1 = Math.sin(t * 0.006 + (i + 1) * 0.9) * 6 * ((i + 1) / 6);
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineWidth = Math.max(0.8, 3 - i * 0.45);
        ctx.stroke();
      }
      // body: a diamond with curved wings
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, 120);
      grad.addColorStop(0, '#8fa3b5');
      grad.addColorStop(0.7, '#6b7f92');
      grad.addColorStop(1, '#4a5a6b');
      ctx.beginPath();
      ctx.moveTo(95, 0);
      ctx.bezierCurveTo(70, -55, 45, -95, 5, -108 + flap);
      ctx.bezierCurveTo(-35, -95, -70, -45, -85, 0);
      ctx.bezierCurveTo(-70, 45, -35, 95, 5, 108 - flap);
      ctx.bezierCurveTo(45, 95, 70, 55, 95, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(230, 220, 205, 0.5)';
      ctx.stroke();
      // two small eyes near the front
      ctx.fillStyle = '#2b2620';
      ctx.beginPath(); ctx.arc(58, -13, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(58, 13, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Draw a polygon whose corners are rounded just a little (radius r),
    // so a sharp-edged shape gets soft corners without changing its outline.
    function roundedPoly(ctx, pts, r){
      ctx.beginPath();
      const n = pts.length;
      for(let i = 0; i < n; i++){
        const p = pts[i];
        const prev = pts[(i - 1 + n) % n];
        const next = pts[(i + 1) % n];
        const v1x = p[0] - prev[0], v1y = p[1] - prev[1];
        const v2x = next[0] - p[0], v2y = next[1] - p[1];
        const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
        const a1x = p[0] - v1x / l1 * r, a1y = p[1] - v1y / l1 * r;
        const a2x = p[0] + v2x / l2 * r, a2y = p[1] + v2y / l2 * r;
        if(i === 0) ctx.moveTo(a1x, a1y);
        else ctx.lineTo(a1x, a1y);
        ctx.quadraticCurveTo(p[0], p[1], a2x, a2y);
      }
      ctx.closePath();
    }

    // Baby whale shark, top-down, facing +x in local space. Torpedo
    // body with sharp, straight edges and a square (flat) head, white
    // spots and pale stripes on a grey-blue back, big round pectoral
    // fins, and a tail that sways as it swims.
    const WHALE_SPOTS = (() => {
      // deterministic spots so they don't flicker between frames
      let seed = 1234567;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const spots = [];
      for (let i = 0; i < 80; i++) {
        const x = -160 + rnd() * 360;
        const halfW = x > 80 ? 70 - (x - 80) * 0.35 : x < -100 ? 66 - (-100 - x) * 0.8 : 68;
        const y = (rnd() * 2 - 1) * Math.max(8, halfW - 8);
        spots.push({ x, y, r: 1.5 + rnd() * 1.8 });
      }
      return spots;
    })();
    function drawWhaleShark(ctx, time, v){
      const t = time + v.timeOffset;
      const sway = Math.sin(t * 0.003 + v.phase) * 0.16;
      const sc = Math.min(1, Math.min(canvas.width, canvas.height) / 900) * v.scale;
      ctx.save();
      ctx.translate(v.x, v.y + Math.sin(t * 0.001) * 6);
      ctx.rotate(v.angle + Math.sin(t * 0.002 + v.phase) * 0.03);
      ctx.scale(sc, sc);
      // tail fin (sways side to side) — a crescent at the back
      ctx.save();
      ctx.translate(-170, 0);
      ctx.rotate(sway);
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.quadraticCurveTo(-38, -52, -62, -46);
      ctx.quadraticCurveTo(-42, -18, -30, 0);
      ctx.quadraticCurveTo(-42, 18, -62, 46);
      ctx.quadraticCurveTo(-38, 52, 0, 14);
      ctx.closePath();
      ctx.fillStyle = '#3a4a5a';
      ctx.fill();
      ctx.restore();
      // pectoral fins — big and round, like paddles, one on each side
      // (the rounded fins in the sketch, one above and one below the body)
      [-1, 1].forEach(side => {
        ctx.beginPath();
        ctx.moveTo(90, side * 60);
        ctx.quadraticCurveTo(30, side * 132, -30, side * 116);
        ctx.quadraticCurveTo(-58, side * 106, -36, side * 70);
        ctx.quadraticCurveTo(20, side * 62, 90, side * 60);
        ctx.closePath();
        ctx.fillStyle = '#42536a';
        ctx.fill();
      });
      // body: back to the torpedo shape, but with sharper, straighter
      // edges and a square (flat) head instead of a rounded point.
      // The corners are rounded just a tiny bit (radius 10) so the
      // edges feel soft, not pointy.
      const grad = ctx.createLinearGradient(0, -72, 0, 72);
      grad.addColorStop(0, '#5a6a7a');
      grad.addColorStop(0.5, '#42536a');
      grad.addColorStop(1, '#2e3a46');
      roundedPoly(ctx, [[200,-48],[200,48],[110,70],[-60,70],[-168,18],[-168,-18],[-60,-70],[110,-70]], 10);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(200, 220, 235, 0.35)';
      ctx.stroke();
      // pale stripes across the back
      ctx.strokeStyle = 'rgba(220, 235, 245, 0.22)';
      ctx.lineWidth = 2;
      [-120, -70, -20, 30, 80, 130].forEach(x => {
        ctx.beginPath();
        ctx.moveTo(x, -58);
        ctx.quadraticCurveTo(x + 8, 0, x, 58);
        ctx.stroke();
      });
      // white spots
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      WHALE_SPOTS.forEach(sp => {
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
        ctx.fill();
      });
      // wide mouth line at the front
      ctx.strokeStyle = 'rgba(20, 30, 40, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(185, -28);
      ctx.quadraticCurveTo(205, 0, 185, 28);
      ctx.stroke();
      ctx.restore();
    }

    // --- Unlocked pets: seahorse, baby otter, baby octopus ---
    // Medium-sized friends that swim in your lagoon after you crack
    // open the mystery shell. They wander gently, steer clear of the
    // rocks, and you can tap one to pet it (it wiggles happily).
    function spawnPet(kind){
      const w = canvas.width, h = canvas.height;
      const p = {
        kind,
        x: 100 + Math.random() * Math.max(100, w - 200),
        y: h * 0.3 + Math.random() * h * 0.4,
        angle: Math.random() < 0.5 ? 0 : Math.PI,
        targetAngle: 0,
        speed: 0.35 + Math.random() * 0.15,
        scale: 0.9 + Math.random() * 0.3,
        phase: Math.random() * 1000,
        happy: 0
      };
      p.targetAngle = p.angle;
      pets.push(p);
    }
    function updatePets(time, dt, width, height){
      for (const p of pets) {
        // gentle wandering: pick a new direction every so often
        if (Math.random() < 0.004 * dt) p.targetAngle = Math.random() * Math.PI * 2;
        let diff = p.targetAngle - p.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        p.angle += diff * 0.02 * dt;
        p.x += Math.cos(p.angle) * p.speed * dt;
        p.y += Math.sin(p.angle) * p.speed * dt * 0.6;
        // stay in the lagoon and out of the rocks
        const rb = rockBounds(width, height);
        if (p.x < 60) { p.x = 60; p.targetAngle = 0; }
        if (p.x > width - 60) { p.x = width - 60; p.targetAngle = Math.PI; }
        if (p.y < 60) { p.y = 60; p.targetAngle = Math.PI / 2; }
        if (p.y > height - 60) { p.y = height - 60; p.targetAngle = -Math.PI / 2; }
        if (p.x > rb.x0 - 40 && p.y < rb.y1 + 40) p.y = rb.y1 + 40;
        if (p.happy > 0) p.happy -= dt;
      }
    }
    function drawSeahorse(ctx, time, p){
      // a seahorse swims upright, so it stays vertical and just flips
      // to face the way it's drifting, with a gentle bob
      const bob = Math.sin(time * 0.0012 + p.phase) * 3;
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.scale(p.scale * (Math.cos(p.angle) < 0 ? -1 : 1), p.scale);
      // curled tail (bottom)
      ctx.strokeStyle = '#d98e32';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.quadraticCurveTo(-14, 34, -4, 44);
      ctx.quadraticCurveTo(4, 50, 2, 42);
      ctx.stroke();
      // body: an S-curved belly, golden with a pale belly
      const bodyGrad = ctx.createLinearGradient(-14, 0, 14, 0);
      bodyGrad.addColorStop(0, '#e8a34c');
      bodyGrad.addColorStop(0.6, '#f5c86e');
      bodyGrad.addColorStop(1, '#e8a34c');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(-10, -28);
      ctx.quadraticCurveTo(-16, -8, -12, 8);
      ctx.quadraticCurveTo(-10, 18, 0, 20);
      ctx.quadraticCurveTo(10, 18, 12, 8);
      ctx.quadraticCurveTo(16, -8, 10, -28);
      ctx.quadraticCurveTo(0, -34, -10, -28);
      ctx.fill();
      // little belly ridges
      ctx.strokeStyle = 'rgba(180, 110, 30, 0.6)';
      ctx.lineWidth = 1.5;
      [-14, -4, 6].forEach(y => {
        ctx.beginPath();
        ctx.moveTo(-11, y);
        ctx.quadraticCurveTo(0, y + 3, 11, y);
        ctx.stroke();
      });
      // dorsal fin on the back (left side)
      ctx.fillStyle = 'rgba(245, 200, 110, 0.9)';
      ctx.beginPath();
      ctx.moveTo(-12, -6);
      ctx.quadraticCurveTo(-24, 2, -12, 10);
      ctx.closePath();
      ctx.fill();
      // head with a long snout, pointing right
      ctx.fillStyle = '#f5c86e';
      ctx.beginPath();
      ctx.moveTo(-8, -28);
      ctx.quadraticCurveTo(-6, -44, 8, -46);
      ctx.quadraticCurveTo(20, -46, 26, -40);
      ctx.quadraticCurveTo(28, -36, 22, -34);
      ctx.quadraticCurveTo(10, -32, 8, -28);
      ctx.closePath();
      ctx.fill();
      // coronet (the little crown on top of its head)
      ctx.fillStyle = '#d98e32';
      ctx.beginPath();
      ctx.moveTo(-4, -44);
      ctx.lineTo(-8, -52);
      ctx.lineTo(-2, -48);
      ctx.lineTo(2, -54);
      ctx.lineTo(6, -47);
      ctx.closePath();
      ctx.fill();
      // eye
      ctx.fillStyle = '#2b1d0e';
      ctx.beginPath();
      ctx.arc(8, -40, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(9, -41, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    function drawOtter(ctx, time, p){
      // a baby otter swimming, facing the way it moves
      const wig = Math.sin(time * 0.004 + p.phase) * 0.12;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle + wig * 0.4);
      ctx.scale(p.scale, p.scale);
      // long tail, tapering, wagging gently
      ctx.strokeStyle = '#6b4423';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-28, 0);
      ctx.quadraticCurveTo(-52, 4 + Math.sin(time * 0.004 + p.phase) * 5, -66, 0);
      ctx.stroke();
      // body: a soft brown sausage, lighter belly
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.ellipse(-6, 0, 34, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c89b6a';
      ctx.beginPath();
      ctx.ellipse(-2, 6, 26, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // little paws paddling
      ctx.fillStyle = '#6b4423';
      ctx.beginPath();
      ctx.ellipse(-18, 12, 7, 4, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8, 12, 7, 4, -0.4, 0, Math.PI * 2);
      ctx.fill();
      // head
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.arc(26, -4, 14, 0, Math.PI * 2);
      ctx.fill();
      // round ears
      ctx.fillStyle = '#6b4423';
      ctx.beginPath();
      ctx.arc(18, -16, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(32, -16, 5, 0, Math.PI * 2);
      ctx.fill();
      // pale face patch
      ctx.fillStyle = '#e8d5b5';
      ctx.beginPath();
      ctx.ellipse(30, 0, 9, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      // nose + eyes
      ctx.fillStyle = '#2b1d0e';
      ctx.beginPath();
      ctx.arc(38, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(26, -8, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(34, -9, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    function drawOctopus(ctx, time, p){
      // a baby octopus, mantle first, eight wavy tentacles trailing
      const wig = Math.sin(time * 0.003 + p.phase);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.scale(p.scale, p.scale);
      // eight wavy tentacles trailing behind (to the left)
      for (let k = -3; k <= 4; k++) {
        const y0 = k * 7;
        const sway = Math.sin(time * 0.004 + p.phase + k * 0.9) * 6;
        ctx.strokeStyle = k % 2 === 0 ? '#a06cd5' : '#b388ff';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-18, y0);
        ctx.quadraticCurveTo(-34, y0 + sway, -48, y0 + sway * 1.4);
        ctx.stroke();
        // little suckers
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(-34, y0 + sway * 0.7, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      // round mantle (head)
      const grad = ctx.createRadialGradient(6, -8, 4, 0, 0, 30);
      grad.addColorStop(0, '#d0a2f7');
      grad.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(4, 0, 26, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      // two big cute eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(14, -8, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(14, 8, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2b1d0e';
      ctx.beginPath();
      ctx.arc(16, -8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(16, 8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(17, -9, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(17, 7, 1, 0, Math.PI * 2);
      ctx.fill();
      // a tiny smile
      ctx.strokeStyle = 'rgba(43, 29, 14, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(24, 0, 4, -0.6, 0.6);
      ctx.stroke();
      ctx.restore();
    }

    // --- Main Render Loop ---
    let lastTime = 0;
    // When the tab was hidden, requestAnimationFrame pauses and lastTime
    // goes stale — without this, the first frame back would compute a huge
    // delta and the game would jump. Resetting lastTime makes the first
    // frame back a normal one instead. (The dt cap below is a second
    // safety net for the same thing.)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) lastTime = 0;
    });
    // Cache the background + vignette gradients: they only change when
    // the window size or the day/night theme changes, so rebuilding them
    // every frame was wasted work that made Chromebooks lag.
    let bgCache = { w: 0, h: 0, theme: '', grad: null };
    let vigCache = { w: 0, h: 0, grad: null };
    // Adaptive quality: this is not a high-end game, so on a slow device
    // it should get simpler instead of choppy. We track a rolling
    // frames-per-second average; if it stays low, lowQuality turns on
    // (god rays off, half the sparkles and particles). If the frame rate
    // recovers, it turns back off.
    let fpsEMA = 60;
    let lowQuality = false;
    let qualityFrames = 0;
    function render(time) {
      const dt = lastTime ? Math.min((time - lastTime) / 16.6667, 4) : 1;
      if (lastTime) {
        const fps = 1000 / Math.max(1, time - lastTime);
        fpsEMA = fpsEMA * 0.95 + fps * 0.05;
        qualityFrames++;
        if (qualityFrames > 180) { // after ~3s warmup
          if (!lowQuality && fpsEMA < 42) lowQuality = true;
          else if (lowQuality && fpsEMA > 55) lowQuality = false;
        }
      }
      lastTime = time;
      const { width, height } = canvas;

      // 1. Background
      if (bgCache.w !== width || bgCache.h !== height || bgCache.theme !== theme) {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        if (theme === 'night') {
          g.addColorStop(0, '#001a2e');
          g.addColorStop(1, '#00060f');
        } else {
          g.addColorStop(0, '#008b8b');
          g.addColorStop(1, '#003333');
        }
        bgCache = { w: width, h: height, theme, grad: g };
      }
      ctx.fillStyle = bgCache.grad;
      ctx.fillRect(0, 0, width, height);

      // 1.1 Vignette Shading (Day Mode Only)
      if (theme === 'day') {
        if (vigCache.w !== width || vigCache.h !== height) {
          const v = ctx.createRadialGradient(
            width / 2, height / 2, Math.min(width, height) * 0.3,
            width / 2, height / 2, Math.max(width, height) * 0.8
          );
          v.addColorStop(0, 'rgba(0,0,0,0)');
          v.addColorStop(1, 'rgba(0, 20, 20, 0.4)');
          vigCache = { w: width, h: height, grad: v };
        }
        ctx.save();
        ctx.fillStyle = vigCache.grad;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }

      // 1.5 Sparkles (Sun glimmers)
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      sparkles.forEach((s, idx) => {
        if (lowQuality && idx % 2) return; // half the sparkles when slow
        // Calculate twinkle alpha based on time and phase
        const alpha = (Math.sin(time * s.twinkleSpeed + s.phase) + 1) * 0.5 * 0.95;
        if (alpha > 0.05) {
          ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // 2. God Rays (skipped entirely when the device is struggling)
      if (!lowQuality) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const rayTime = time * 0.0003;
      for (let i = 0; i < 7; i++) {
        const offset = Math.sin(rayTime + i * 1.5) * 250;
        const alpha = (Math.sin(rayTime * 3 + i) + 1) * 0.02 + 0.01;
        ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(width / 2 - 400 + offset, -100);
        ctx.lineTo(width / 2 + 400 + offset, -100);
        ctx.lineTo(width / 2 + 1000 + offset * 2, height + 100);
        ctx.lineTo(width / 2 - 1000 + offset * 2, height + 100);
        ctx.fill();
      }
      ctx.restore();
      }

      // 3. Food
      gameState.food.forEach(f => {
        f.size += (f.targetSize - f.size) * 0.1 * dt;
        if (f.kind === 'seaweed') { drawSeaweed(ctx, f); return; }
        
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        
        // Enhanced Drop Shadow for Depth
        ctx.shadowColor = 'rgba(0, 15, 30, 0.7)'; // Darker, richer shadow
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;

        // Richer, more contrasting rind gradient
        const rindGrad = ctx.createRadialGradient(-f.size*0.2, -f.size*0.2, f.size * 0.4, 0, 0, f.size);
        rindGrad.addColorStop(0, '#2d6a3c'); // Lighter green highlight on the edge
        rindGrad.addColorStop(0.6, '#143d1f'); // Mid-tone dark green
        rindGrad.addColorStop(1, '#051709'); // Very dark, almost black green for the shadowed edge
        ctx.fillStyle = rindGrad;
        ctx.beginPath();
        for (let i = 0; i <= Math.PI * 2 + 0.1; i += 0.3) {
          // Slightly bumpier rind texture
          const r = f.size + Math.sin(i * 7) * (f.size * 0.05);
          if (i === 0) ctx.moveTo(r, 0); else ctx.lineTo(Math.cos(i) * r, Math.sin(i) * r);
        }
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.shadowColor = 'transparent';

        // More pronounced shading on the flesh
        const fleshGrad = ctx.createRadialGradient(-f.size*0.1, -f.size*0.1, 0, 0, 0, f.size * 0.9);
        fleshGrad.addColorStop(0, '#ffffff'); // Bright white center highlight
        fleshGrad.addColorStop(0.4, '#e0f7e6'); // Pale green mid-tone
        fleshGrad.addColorStop(0.8, '#a3e0b8'); // Solid cucumber flesh color
        fleshGrad.addColorStop(1, '#5db37a'); // Darker inner shadow near the rind
        ctx.fillStyle = fleshGrad;
        ctx.beginPath();
        ctx.arc(0, 0, f.size * 0.88, 0, Math.PI * 2);
        ctx.fill();

        // Shaded seed cavities
        for (let i = 0; i < 3; i++) {
          const angle = (Math.PI * 2 / 3) * i;
          ctx.save();
          ctx.rotate(angle);
          
          // Cavity background with inner shadow
          const cavityGrad = ctx.createRadialGradient(f.size * 0.35, 0, 0, f.size * 0.35, 0, f.size * 0.25);
          cavityGrad.addColorStop(0, 'rgba(150, 210, 170, 0.4)'); // Translucent center
          cavityGrad.addColorStop(1, 'rgba(100, 180, 130, 0.8)'); // Darker edge for depth

          ctx.fillStyle = cavityGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(f.size * 0.3, f.size * 0.25, f.size * 0.6, f.size * 0.35, f.size * 0.5, 0);
          ctx.bezierCurveTo(f.size * 0.6, -f.size * 0.35, f.size * 0.3, -f.size * 0.25, 0, 0);
          ctx.fill();

          // Seeds with slight drop shadows
          ctx.shadowColor = 'rgba(0,0,0,0.2)';
          ctx.shadowBlur = 2;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = '#fffff0'; // Slightly off-white seeds
          ctx.beginPath();
          ctx.ellipse(f.size * 0.35, f.size * 0.12, f.size * 0.08, f.size * 0.04, 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(f.size * 0.35, -f.size * 0.12, f.size * 0.08, f.size * 0.04, -0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      });

      // 4. Waves
      gameState.waves = gameState.waves.filter(w => w.age < w.life);
      gameState.waves.forEach(w => {
        w.age += dt;
        const prog = w.age / w.life;
        const radius = 10 + (w.age * w.speed);
        const alpha = 1 - prog;
        
        ctx.beginPath();
        ctx.arc(w.x, w.y, radius, 0, Math.PI * 2);
        ctx.lineWidth = 4 * alpha;
        ctx.strokeStyle = `rgba(180, 230, 255, ${alpha * 0.5})`;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(w.x, w.y, radius + 15 * prog, 0, Math.PI * 2);
        ctx.lineWidth = 2 * alpha;
        ctx.strokeStyle = `rgba(100, 200, 255, ${alpha * 0.3})`;
        ctx.stroke();
      });

      // 5. Turtles
      turtles.forEach(t => {
        // at night, the night sleepers swim away to sleep — they're not
        // here, so skip them (they come back in the daytime, and the
        // jellyfish get the lagoon to themselves)
        if (theme === 'night' && t.nightSleeper) return;

        let isAvoidingEdge = false;
        let foundFood = false;
        let scaredByWave = false;


        // Check for nearby waves and scare turtles away (ignore waves created by food drops)
        let nearestWaveDist = Infinity;
        let nearestWave = null;
        gameState.waves.forEach(w => {
          if (w.source === 'food' || w.source === 'waterfall' || w.source === 'splash') return; // food, waterfall and splashes don't scare turtles
          const dist = Math.hypot(w.x - t.x, w.y - t.y);
          if (dist < nearestWaveDist) {
            nearestWaveDist = dist;
            nearestWave = w;
          }
        });
        if (nearestWave && nearestWaveDist < 120) {
          scaredByWave = true;
          t.targetAngle = Math.atan2(t.y - nearestWave.y, t.x - nearestWave.x);
          t.speed = t.baseSpeed * 3.5;
        }

        if (!scaredByWave && gameState.food.length > 0) {
          let nearestFood = null;
          let nearestDist = Infinity;
          gameState.food.forEach((f, index) => {
            if (f.kind && f.kind !== 'cucumber') return; // turtles only eat cucumber
            const dist = Math.hypot(f.x - t.x, f.y - t.y);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearestFood = { f, index };
            }
          });
          if (nearestFood && nearestDist < 1200) {
            foundFood = true;
            t.targetAngle = Math.atan2(nearestFood.f.y - t.y, nearestFood.f.x - t.x);
            t.speed = t.baseSpeed * 4.5;
            if (nearestDist < 60 * t.scaleMult) {
               gameState.food.splice(nearestFood.index, 1);
               // happy turtle! It spins with joy and hearts float up
               // for a few seconds after eating. Feeding fills its
               // Tamagotchi hearts a little bit too. If it was hungry,
               // eating clears its food need.
               t.happy = 180;
               t.happySpin = 0;
               careFor(t, 15);
               if (t.need === 'food') clearNeed(t);
            }
          }
        }

        if (!foundFood) t.speed = t.baseSpeed;

        // Play with balls: a turtle that spots a beach ball nearby
        // swims over and nudges it — and feels happy doing it.
        if (!foundFood && !scaredByWave && gameState.balls.length > 0) {
          let nearestBall = null, nearestBallDist = Infinity;
          gameState.balls.forEach(b => {
            const d = Math.hypot(b.x - t.x, b.y - t.y);
            if (d < nearestBallDist) { nearestBallDist = d; nearestBall = b; }
          });
          if (nearestBall && nearestBallDist < 400) {
            t.targetAngle = Math.atan2(nearestBall.y - t.y, nearestBall.x - t.x);
            t.speed = t.baseSpeed * 2.5;
            if (nearestBallDist < 55 * t.scaleMult) {
              const a = Math.atan2(nearestBall.y - t.y, nearestBall.x - t.x);
              nearestBall.vx += Math.cos(a) * 2;
              nearestBall.vy += Math.sin(a) * 2;
              if (t.happy <= 0) t.happy = 60;
            }
          }
        }

        if (!foundFood && Math.random() < 0.01 * dt) {
          t.targetAngle += (Math.random() - 0.5) * Math.PI;
        }

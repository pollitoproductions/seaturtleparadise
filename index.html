        // Reduce margin so turtles can wander farther off screen
        const marginX = Math.min(width * 0.05, 44 * t.scaleMult);
        const marginY = Math.min(height * 0.05, 44 * t.scaleMult);

        // Only avoid edges when not actively pursuing food; allow small off-screen roaming while chasing
        if (!foundFood && (t.x < marginX || t.x > width - marginX || t.y < marginY || t.y > height - marginY)) {
          isAvoidingEdge = true;
          t.targetAngle = Math.atan2((height / 2) - t.y, (width / 2) - t.x);
        }

        let diff = t.targetAngle - t.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        t.angle += diff * (isAvoidingEdge ? 0.08 : (foundFood ? 0.07 : 0.015)) * dt;
        t.x += Math.cos(t.angle) * t.speed * dt;
        t.y += Math.sin(t.angle) * t.speed * dt;


        // Every turtle stays inside the frame — no drifting off-screen.
        // (The old code let them wander ~12% past the edge to reach
        // food; now they stay fully visible, and can still reach food
        // at the edge from 36px in.)
        const padding = 36;
        t.x = Math.max(padding, Math.min(width - padding, t.x));
        t.y = Math.max(padding, Math.min(height - padding, t.y));

        // Rocks are solid: a turtle that swims into the waterfall gets
        // pushed back out (to the nearest edge — left or bottom) and
        // steered back toward the lagoon. The 22px margin keeps its
        // body clear of the stones instead of overlapping them. The
        // rocks and the cliff face are the wall — below the water's
        // base the lagoon is open, so turtles can swim in the pool at
        // the foot of the fall, just not up under the rocks.
        var rb = rockBounds(width, height), rbuf = 22;
        if(t.x > rb.x0 - rbuf && t.x < rb.x1 && t.y > rb.y0 && t.y < rb.y1 + rbuf){
          if((t.x - (rb.x0 - rbuf)) < ((rb.y1 + rbuf) - t.y)){ t.x = rb.x0 - rbuf; }
          else { t.y = rb.y1 + rbuf; }
          t.targetAngle = Math.atan2((height / 2) - t.y, (width / 2) - t.x);
        }

        // Happy spin: after eating, the turtle spins with joy for a
        // few seconds (t.happy counts down from 180 frames).
        if (t.happy > 0) { t.happy -= dt; t.happySpin = (t.happySpin || 0) + dt * 0.04; }
        // the hearts meter fades away a few seconds after you care for it
        if (t.heartShow > 0) t.heartShow -= dt;
        // Needs: when the timer runs out, the turtle wants something —
        // love, food, or a pat. The icon stays until you help.
        if (!t.need) {
          t.needTimer -= dt;
          if (t.needTimer <= 0) {
            const kinds = ['love', 'food', 'pat'];
            t.need = kinds[Math.floor(Math.random() * kinds.length)];
          }
        }

        drawRealisticTurtle(ctx, time, width, height, t);

        // the need icon floats above the turtle in a little bubble
        if (t.need) {
          const bob = Math.sin(time * 0.003 + (t.phase || 0)) * 4;
          const ny = t.y - 72 + bob;
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
          ctx.beginPath();
          ctx.arc(t.x, ny, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(NEED_ICON[t.need], t.x, ny + 1);
          ctx.restore();
        }
      });

    // --- Mini waterfall (top-right corner) ---
    // A stack of natural rocks in the corner, with water pouring over
    // them and flowing DIAGONALLY down-left into the lagoon, like a
    // river waterfall coming straight out of the corner. The water
    // stretches across the whole rock formation. The rocks are always
    // there; the water only flows in 'water' mode (the wave setting).
    // The ripples it makes are gentle and never scare the turtles
    // (see the scare check — source 'waterfall').
    // The rock bank (top-right corner) is solid. Turtles can't swim
    // under the rocks — but they CAN swim under the waterfall water
    // (the diagonal sheet below the rocks, in the lagoon). These bounds
    // match the drawn rock bank: from the leftmost stone to the right
    // edge, top edge down to the base tier. Turtles are pushed out of
    // this box; the water below it stays open.
    // One scale for the whole waterfall, from BOTH dimensions so it
    // fits in portrait and landscape: it shrinks on narrow screens
    // AND on short screens, so it never takes up half the frame.
    // (The old scale used width only, so in portrait the stones
    // shrank but the height stayed fixed — they separated vertically
    // and the fall still filled a third of the screen.)
    function waterfallScale(width, height){
      return Math.max(0.35, Math.min(0.75, Math.min(width / 1000, height / 800)));
    }
    // The rock bank and the cliff face are solid — nothing goes under
    // or behind them. The falling water itself is NOT a wall: below
    // the water's base (y1) the lagoon is open, so animals can swim
    // in the pool at the foot of the fall, just not up under the rocks.
    // (These numbers must match the face in drawWaterfall:
    // faceBaseL = width - 605*sc, faceBaseY = baseY = 235*sc.)
    function rockBounds(width, height){
      var sc = waterfallScale(width, height);
      return { x0: width - 605 * sc, y0: 0, x1: width, y1: 235 * sc };
    }
    let lastFallWave = 0;
    function drawWaterfall(ctx, time, width, height){
      // One scale for the whole fall, from both dimensions (see
      // waterfallScale above) — it shrinks on narrow screens AND on
      // short screens, so it never takes up half the frame, in
      // portrait or landscape. The vertical geometry scales with it
      // too, so the stones keep overlapping the same way in both
      // orientations instead of separating in portrait.
      const sc = waterfallScale(width, height);
      const fallX = width - 220 * sc;                       // left of the buttons
      // Deterministic 0..1 hash — the stones' shapes must be identical
      // every frame, or they would shimmer. (Math.random() per frame
      // would wobble them.)
      const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      // The falling water's geometry — hoisted here because the cliff
      // face below uses the same numbers (the face sits behind the
      // sheet, and the water block further down reuses them).
      const lipY = 60 * sc;    // where the water pours over the rocks
      const baseY = 235 * sc;  // where it hits the lagoon
      const topL = fallX - 210 * sc, topR = fallX + 190 * sc;  // spans the whole rock bank
      const shift = 120 * sc;  // how far left the base sits (the diagonal)
      const fallH = baseY - lipY;
      // The precipice face: a dark rock wall behind the falling water,
      // leaning down-left toward the centre of the screen, so the water
      // pours down a cliff instead of floating in front of flat stones.
      // Its bottom-left corner juts further left than the water's base
      // — a rocky point reaching toward the middle of the lagoon. The
      // face ends at the water's base, so below it the lagoon is open
      // (animals can swim in the pool at the foot of the fall). Drawn
      // first, so the stones sit on top of it and the water falls down
      // in front of it.
      const faceTopL = topL - 20 * sc, faceTopR = topR + 20 * sc;
      const faceBaseL = topL - shift - 55 * sc, faceBaseR = topR - shift + 15 * sc;
      const faceTopY = lipY - 15 * sc, faceBaseY = baseY;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(faceTopL, faceTopY);
      ctx.lineTo(faceTopR, faceTopY);
      ctx.lineTo(faceBaseR, faceBaseY - 10 * sc);
      ctx.lineTo(faceBaseL, faceBaseY);
      ctx.closePath();
      const fg = ctx.createLinearGradient(0, faceTopY, 0, faceBaseY);
      fg.addColorStop(0, '#5a6a7a');
      fg.addColorStop(0.55, '#3a4653');
      fg.addColorStop(1, '#232c36');
      // the real rock photo if it has loaded, else the gradient —
      // either way the face gets a dark shading wash toward the
      // bottom so it reads as a cliff in shadow
      if (rockPattern) {
        ctx.fillStyle = rockPattern;
        ctx.fill();
      } else {
        ctx.fillStyle = fg;
        ctx.fill();
      }
      const faceShade = ctx.createLinearGradient(0, faceTopY, 0, faceBaseY);
      faceShade.addColorStop(0, 'rgba(0,0,0,0)');
      faceShade.addColorStop(0.55, 'rgba(10,15,25,0.25)');
      faceShade.addColorStop(1, 'rgba(10,15,25,0.55)');
      ctx.fillStyle = faceShade;
      ctx.fill();
      ctx.clip();
      // vertical striations running down the face, following its lean
      const faceLean = faceTopL - faceBaseL;  // how far left the face leans, top to bottom
      for (let i = 0; i < 10; i++) {
        const sx = faceTopL + ((i + 0.5) / 10) * (faceTopR - faceTopL);
        ctx.beginPath();
        ctx.moveTo(sx, faceTopY);
        ctx.lineTo(sx - faceLean, faceBaseY);
        ctx.strokeStyle = i % 2 ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      // a couple of cracks in the face (scaled, so they fit the face
      // at any size — the clip keeps them inside it regardless)
      for (let c = 0; c < 2; c++) {
        const cx0 = faceTopL + hash(c * 7 + 41) * (faceTopR - faceTopL);
        const cy0 = faceTopY + 40 * sc + hash(c * 11 + 43) * 60 * sc;
        ctx.beginPath();
        ctx.moveTo(cx0, cy0);
        ctx.lineTo(cx0 - (12 + hash(c * 3 + 47) * 14) * sc, cy0 + 34 * sc);
        ctx.lineTo(cx0 - (22 + hash(c * 5 + 53) * 10) * sc, cy0 + 62 * sc);
        ctx.strokeStyle = 'rgba(10, 18, 26, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore();
      // outline the face so its edge reads against the water and the lagoon
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(faceTopL, faceTopY);
      ctx.lineTo(faceTopR, faceTopY);
      ctx.lineTo(faceBaseR, faceBaseY - 10 * sc);
      ctx.lineTo(faceBaseL, faceBaseY);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(15, 25, 35, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      // Rocks: a wide bank filling the WHOLE top-right corner — four
      // staggered tiers of stones, overlapping so they read as one solid
      // rocky bank, not a little pile. The bank runs from the top edge
      // down to the lagoon and from the right edge left across the corner.
      // The colours are deliberately varied — cool slate, warm brown-grey,
      // dark basalt, a mossy hint — so the bank reads as stone, not one
      // flat grey cloud. (The old bank was smooth ovals in one grey, and
      // on a phone it read as raining clouds.)
      const rocks = [
        // top tier (along the top edge)
        {x:-205, y:18, rx:62, ry:28, rot:0.04, c:'#6b7280'},
        {x:-110, y:14, rx:58, ry:26, rot:-0.05, c:'#7d6f5f'},
        {x:-15, y:20, rx:64, ry:30, rot:0.06, c:'#5b6470'},
        {x:80, y:15, rx:60, ry:27, rot:-0.03, c:'#8a7a68'},
        {x:170, y:18, rx:62, ry:28, rot:0.05, c:'#4a5560'},
        // second tier
        {x:-235, y:60, rx:60, ry:30, rot:-0.07, c:'#3f4a55'},
        {x:-140, y:58, rx:64, ry:31, rot:0.05, c:'#64707d'},
        {x:-45, y:62, rx:62, ry:30, rot:-0.04, c:'#7d6f5f'},
        {x:50, y:58, rx:66, ry:32, rot:0.06, c:'#5a6a5a'},
        {x:145, y:60, rx:60, ry:29, rot:-0.05, c:'#6b7280'},
        {x:205, y:58, rx:56, ry:28, rot:0.04, c:'#5b6470'},
        // third tier
        {x:-210, y:105, rx:62, ry:31, rot:0.06, c:'#7d8894'},
        {x:-115, y:102, rx:60, ry:30, rot:-0.05, c:'#454f5c'},
        {x:-20, y:108, rx:64, ry:32, rot:0.04, c:'#6e6258'},
        {x:75, y:104, rx:62, ry:31, rot:-0.06, c:'#64707d'},
        {x:170, y:106, rx:60, ry:30, rot:0.05, c:'#8a7a68'},
        // base tier (meets the lagoon)
        {x:-175, y:148, rx:64, ry:31, rot:-0.05, c:'#4a5560'},
        {x:-80, y:150, rx:62, ry:30, rot:0.06, c:'#7d6f5f'},
        {x:15, y:148, rx:64, ry:31, rot:-0.04, c:'#5b6470'},
        {x:110, y:150, rx:60, ry:30, rot:0.05, c:'#6b7280'},
        {x:190, y:148, rx:58, ry:29, rot:-0.06, c:'#3f4a55'}
      ];
      ctx.save();
      rocks.forEach((r, ri) => {
        ctx.save();
        ctx.translate(fallX + r.x * sc, r.y * sc);
        ctx.rotate(r.rot);
        const RX = r.rx * sc, RY = r.ry * sc;
        // an irregular faceted stone, not a smooth oval: 8 vertices with
        // the radius jittered ±18% — facets and corners are what make a
        // shape read as rock instead of a cloud
        const pts = [];
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2;
          const rr = 1 + (hash(ri * 31 + k * 7 + 3) - 0.5) * 0.36;
          pts.push([Math.cos(a) * RX * rr, Math.sin(a) * RY * rr]);
        }
        ctx.beginPath();
        pts.forEach((p, k) => { if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
        ctx.closePath();
        ctx.fillStyle = r.c;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(15, 25, 35, 0.7)';
        ctx.stroke();
        // facet shading: a dark lower face and a lit top face, so each
        // stone has dimension instead of one flat grey
        ctx.save();
        ctx.clip();
        ctx.beginPath();
        ctx.ellipse(0, RY * 0.55, RX * 1.05, RY * 0.6, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 10, 20, 0.28)';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, -RY * 0.5, RX * 0.7, RY * 0.32, 0, Math.PI, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.20)';
        ctx.fill();
        ctx.restore();
        // speckles: tiny darker and lighter grains in the stone
        for (let s = 0; s < 3; s++) {
          const hx = hash(ri * 17 + s * 5 + 11), hy = hash(ri * 23 + s * 3 + 7);
          ctx.beginPath();
          ctx.arc((hx - 0.5) * RX * 1.2, (hy - 0.5) * RY * 1.1, Math.max(1, 1.6 * sc), 0, Math.PI * 2);
          ctx.fillStyle = s % 2 ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.22)';
          ctx.fill();
        }
        // a crack across the face on every other stone
        if (ri % 2 === 0) {
          const cx0 = (hash(ri * 13 + 1) - 0.5) * RX;
          const cy0 = (hash(ri * 19 + 2) - 0.5) * RY * 0.6;
          ctx.beginPath();
          ctx.moveTo(cx0, cy0);
          ctx.lineTo(cx0 + RX * 0.3, cy0 + RY * 0.25);
          ctx.lineTo(cx0 + RX * 0.45, cy0 - RY * 0.1);
          ctx.strokeStyle = 'rgba(10, 20, 30, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();
      });
      // Falling water (only in water mode — the wave setting).
      // lipY, baseY, topL, topR, shift and fallH are defined above
      // (the cliff face uses them too).
      if(mode === 'water'){
        ctx.save();
        // wide diagonal sheet, leaning left as it falls — a little more
        // opaque now, with a bright lip where it pours over the rocks
        ctx.beginPath();
        ctx.moveTo(topL, lipY);
        ctx.lineTo(topR, lipY);
        ctx.lineTo(topR - shift, baseY);
        ctx.lineTo(topL - shift, baseY);
        ctx.closePath();
        // the real water photo if it has loaded, under the fade
        // gradient so the sheet still lightens toward the top
        if (waterPattern) {
          ctx.fillStyle = waterPattern;
          ctx.fill();
        }
        const wg = ctx.createLinearGradient(0, lipY, 0, baseY);
        wg.addColorStop(0, 'rgba(215, 240, 255, 0.85)');
        wg.addColorStop(0.5, 'rgba(190, 235, 255, 0.55)');
        wg.addColorStop(1, 'rgba(190, 235, 255, 0.3)');
        ctx.fillStyle = wg;
        ctx.fill();
        ctx.clip();
        // broad soft currents: a few wide, faint bands flowing down
        for (let i = 0; i < 4; i++) {
          const cx = topL + ((i * 97 + 30) % (topR - topL));
          const off = (time * 0.05 + i * 60) % fallH;
          const bx = cx - off * (shift / fallH);
          const by = lipY + off;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx - 40 * (shift / fallH), by + 40);
          ctx.strokeStyle = 'rgba(255,255,255,0.18)';
          ctx.lineWidth = 10 * sc;
          ctx.stroke();
        }
        // many thin fast streaks, all different widths, speeds and
        // brightnesses — the falling water reads as flowing currents,
        // not drizzle
        for (let i = 0; i < 12; i++) {
          const startX = topL + ((i * 37 + 20) % (topR - topL));
          const speed = 0.10 + hash(i * 3 + 1) * 0.08;
          const off = (time * speed + i * 29) % fallH;
          const sx = startX - off * (shift / fallH);
          const sy = lipY + off;
          const len = 20 + hash(i * 5 + 2) * 26;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx - len * (shift / fallH), sy + len);
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + hash(i * 7 + 4) * 0.35).toFixed(2) + ')';
          ctx.lineWidth = 1 + hash(i * 11 + 5) * 2;
          ctx.stroke();
        }
        ctx.restore();
        // foamy lip where the water pours over the rocks
        for (let i = 0; i < 8; i++) {
          const lx = topL + 12 * sc + i * ((topR - topL - 24 * sc) / 7);
          const lr = 3 + Math.sin(time * 0.008 + i * 2.1) * 1.5;
          ctx.beginPath();
          ctx.arc(lx, lipY + 2, Math.max(1.5, lr), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(240, 250, 255, 0.85)';
          ctx.fill();
        }
        // foam at the base: a frothy band of bubbles of all sizes
        const baseCx = (topL + topR) / 2 - shift;  // centre of the base edge
        for (let i = 0; i < 12; i++) {
          const fx = (topL - shift) + 10 * sc + i * ((topR - topL - 20 * sc) / 11);
          const fr = 3 + hash(i * 3 + 8) * 6 + Math.sin(time * 0.006 + i * 1.7) * 1.5;
          ctx.beginPath();
          ctx.arc(fx, baseY + 4 + Math.sin(time * 0.005 + i) * 1.5, Math.max(2, fr), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(230, 245, 255,' + (0.6 + hash(i * 5 + 9) * 0.3).toFixed(2) + ')';
          ctx.fill();
        }
        // mist: soft pale puffs drifting up from where the water hits
        for (let m = 0; m < 3; m++) {
          const mx = baseCx + (hash(m * 7 + 20) - 0.5) * (topR - topL) * 0.6;
          const my = baseY - 14 - ((time * 0.02 + m * 47) % 34);
          const mr = 16 + hash(m * 11 + 30) * 14;
          const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
          mg.addColorStop(0, 'rgba(235, 245, 255, 0.16)');
          mg.addColorStop(1, 'rgba(235, 245, 255, 0)');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.arc(mx, my, mr, 0, Math.PI * 2);
          ctx.fill();
        }
        // a gentle ripple every ~1.4s
        if(time - lastFallWave > 1400){
          pushWave({ x: baseCx + (Math.random() - 0.5) * 60, y: baseY + 6, age: 0, life: 130, speed: 1.1, source: 'waterfall' });
          lastFallWave = time;
        }
      }
      ctx.restore();
    }

      // 5.5 Rare visitors (stingray / baby stingray / baby whale shark)
      updateVisitors(time, dt, width, height);
      visitors.forEach(v => {
        if (v.kind === 'whaleShark') drawWhaleShark(ctx, time, v);
        else drawStingray(ctx, time, v);
      });
      // 5.5b Unlocked pets (seahorse / baby otter / baby octopus)
      updatePets(time, dt, width, height);
      pets.forEach(p => {
        if (p.kind === 'seahorse') drawSeahorse(ctx, time, p);
        else if (p.kind === 'otter') drawOtter(ctx, time, p);
        else drawOctopus(ctx, time, p);
      });
      // 5.6 Glowing jellyfish (night only, all different colours)
      updateJellyfish(time, dt, width, height);
      jellyfish.forEach(j => drawJellyfish(ctx, time, j));
      // 5.7 Treasures to collect (shells + starfish on the seafloor)
      updateCollectibles(time, dt, width, height);
      collectibles.forEach(c => drawCollectible(ctx, time, c));
      // 5.8 Beach balls: they bob and drift slowly; turtles swim over
      // and nudge them when they play
      gameState.balls.forEach(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt + Math.sin(time * 0.002 + b.phase) * 0.3 * dt;
        b.vx *= 0.985; b.vy *= 0.985;
        if (b.x < 30) { b.x = 30; b.vx = Math.abs(b.vx); }
        if (b.x > width - 30) { b.x = width - 30; b.vx = -Math.abs(b.vx); }
        if (b.y < 30) { b.y = 30; b.vy = Math.abs(b.vy); }
        if (b.y > height - 30) { b.y = height - 30; b.vy = -Math.abs(b.vy); }
        const bob = Math.sin(time * 0.002 + b.phase) * 2;
        ctx.save();
        ctx.translate(b.x, b.y + bob);
        ctx.rotate(b.rot + time * 0.0004);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, -0.6, 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 217, 61, 0.9)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, 2.0, 3.2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
      // tiny splashes (baby whale shark entering / leaving)
      for (let i = splashes.length - 1; i >= 0; i--) {
        const sp = splashes[i];
        sp.age += dt;
        if (sp.age >= sp.life) { splashes.splice(i, 1); continue; }
        const prog = sp.age / sp.life;
        for (let j = 0; j < 6; j++) {
          const a = -Math.PI / 2 + (j - 2.5) * 0.35;
          const d = prog * 26;
          ctx.beginPath();
          ctx.arc(sp.x + Math.cos(a) * d, sp.y + Math.sin(a) * d - prog * prog * 10, Math.max(0.5, 2.5 * (1 - prog)), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(230, 245, 255, ${0.8 * (1 - prog)})`;
          ctx.fill();
        }
      }

      // 6. Particles
      particles.forEach((p, idx) => {
        if (lowQuality && idx % 2) return; // half the particles when slow
        p.y -= p.speed * dt;
        p.x += Math.sin(time * 0.001 + p.offset) * 0.4 * dt;
        if (p.y < -20) { p.y = height + 20; p.x = Math.random() * width; }
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 7. Waterfall (top-right corner, in front of the turtles)
      drawWaterfall(ctx, time, width, height);

      requestAnimationFrame(render);
    }
    
    // Load your saved shells, starfish, and animals before the game starts.
    loadGame();
    updateTreasureCount();
    updateMenuUnlock();

    requestAnimationFrame(render);

    // --- Interactive Input Handlers ---
    const handlePointerDown = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Tap a glowing jellyfish and it flares bright (no food / wave).
      for (let i = jellyfish.length - 1; i >= 0; i--) {
        const j = jellyfish[i];
        if (Math.hypot(x - j.x, y - j.y) < j.size + 24) { j.lit = 1; return; }
      }

      // Tap a shell or starfish to collect it (no food / wave). A new
      // one washes up so there's always something to find. Collecting
      // 1,000 of either kind earns a new animal!
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        if (Math.hypot(x - c.x, y - c.y) < c.size + 16) {
          if (c.kind === 'shell') shellCount++; else starCount++;
          updateTreasureCount();
          collectibles.splice(i, 1);
          checkUnlock();
          saveGame();
          return;
        }
      }

      // Pet an unlocked animal: tap one and it wiggles happily.
      for (let i = 0; i < pets.length; i++) {
        const p = pets[i];
        if (Math.hypot(x - p.x, y - p.y) < 55 * p.scale + 14) {
          p.happy = 120;
          return;
        }
      }

      // Pet a turtle: tap one and it wiggles happily, hearts float up,
      // and its Tamagotchi hearts fill a little (no food / wave). If it
      // wanted love or a pat on the head, petting clears that need.
      for (let i = 0; i < turtles.length; i++) {
        const t = turtles[i];
        if (theme === 'night' && t.nightSleeper) continue;
        const tapR = 60 * Math.min(1, Math.min(canvas.width, canvas.height) / 900) * t.scaleMult + 18;
        if (Math.hypot(x - t.x, y - t.y) < tapR) {
          t.happy = 120;
          t.happySpin = 0;
          careFor(t, 10);
          if (t.need === 'love' || t.need === 'pat') clearNeed(t);
          return;
        }
      }

      gameState.pointerActive = true;
      gameState.lastX = x;
      gameState.lastY = y;

      // Clamp food drop position to turtles' reachable area
      const foodPadding = Math.min(canvas.width * 0.2, canvas.height * 0.2, 180);
      const clampedX = Math.max(foodPadding * -1, Math.min(canvas.width + foodPadding, x));
      const clampedY = Math.max(foodPadding * -1, Math.min(canvas.height + foodPadding, y));
      if (mode === 'food') {
        pushFood({ x: clampedX, y: clampedY, size: 0, targetSize: foodKind === 'seaweed' ? 9 : 7, rot: Math.random() * Math.PI * 2, kind: foodKind });
        // mark waves created by food drops so turtles won't be scared by them
        pushWave({ x: clampedX, y: clampedY, age: 0, life: 60, speed: 1.5, source: 'food' });
      } else if (mode === 'ball') {
        // drop a beach ball into the water for the turtles to play with
        const colors = ['#ff5a5a', '#4fc3f7', '#ffd93d', '#81c784', '#b388ff'];
        gameState.balls.push({
          x: clampedX, y: clampedY, vx: 0, vy: 0,
          r: 16 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          phase: Math.random() * 1000
        });
        if (gameState.balls.length > 8) gameState.balls.shift();
      } else {
        pushWave({ x, y, age: 0, life: 100, speed: 2.5, source: 'water' });
      }
    };

    const handlePointerMove = (e) => {
      if (!gameState.pointerActive || mode !== 'water') return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const dx = x - gameState.lastX;
      const dy = y - gameState.lastY;
      if (Math.hypot(dx, dy) > 25) {
        pushWave({ x, y, age: 0, life: 80, speed: 2 });
        gameState.lastX = x;
        gameState.lastY = y;
      }
    };

    const handlePointerUp = () => { gameState.pointerActive = false; };

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointerleave', handlePointerUp);

  </script>
</body>
</html>
